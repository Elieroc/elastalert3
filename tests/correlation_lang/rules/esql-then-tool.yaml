name: esql-then-tool
type: correlation
index: logs-corrlang
timestamp_field: "@timestamp"
query_key: host.name
timeframe: {minutes: 30}
realert: {minutes: 0}
alert: debug
correlation_query: "fail THEN tool"
correlation_leaves:
  fail: {num_events: 3, filter: [{term: {event.outcome: failure}}]}
  tool: {filter: [{esql: 'FROM logs-corrlang METADATA _id, _index | WHERE tool == "mimikatz"'}]}
