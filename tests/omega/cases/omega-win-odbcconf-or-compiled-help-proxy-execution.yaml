docs:
- id: odbc
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: odbcconf.exe
      executable: C:\Windows\System32\odbcconf.exe
      command_line: odbcconf -a {REGSVR C:\Users\alice\AppData\Local\Temp\a.dll}
      parent: {name: explorer.exe}
- id: odbc-rsp
  match: true
