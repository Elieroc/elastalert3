docs:
- id: findstr
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: findstr.exe
      executable: C:\Windows\System32\findstr.exe
      command_line: findstr /S /I cpassword \\corp.local\sysvol\corp.local\policies\*.xml
      parent: {name: explorer.exe}
- id: ps
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: powershell.exe
      executable: C:\Windows\System32\powershell.exe
      command_line: powershell Get-GPPPassword
      parent: {name: explorer.exe}
- id: findstr-other
  match: false
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: findstr.exe
      executable: C:\Windows\System32\findstr.exe
      command_line: findstr /S /I todo *.txt
      parent: {name: explorer.exe}
- id: dir
  match: false
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: cmd.exe
      executable: C:\Windows\System32\cmd.exe
      command_line: dir \\corp.local\sysvol
      parent: {name: explorer.exe}
