docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: netsh.exe, executable: 'C:\Windows\System32\netsh.exe', command_line: netsh interface portproxy add
        v4tov4 listenport=3389 connectaddress=10.0.0.5 connectport=3389}
