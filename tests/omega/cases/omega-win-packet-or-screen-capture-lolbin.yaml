docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: pktmon.exe
      executable: 'C:\Windows\System32\pktmon.exe'
      command_line: 'pktmon.exe start --capture'
