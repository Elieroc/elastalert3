docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: fsutil.exe
      executable: 'C:\Windows\System32\fsutil.exe'
      command_line: 'fsutil.exe usn deletejournal /d C:'
