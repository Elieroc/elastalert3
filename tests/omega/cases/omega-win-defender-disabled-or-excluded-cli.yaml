docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: powershell.exe, executable: 'C:\Windows\System32\powershell.exe', command_line: powershell Set-MpPreference
        -DisableRealtimeMonitoring $true}
- id: pos2
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: powershell.exe, executable: 'C:\Windows\System32\powershell.exe', command_line: 'powershell Add-MpPreference
        -ExclusionPath C:\Users\Public'}
- id: pos3
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: sc.exe, executable: 'C:\Windows\System32\sc.exe', command_line: sc stop WinDefend}
- id: pos4
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: netsh.exe, executable: 'C:\Windows\System32\netsh.exe', command_line: netsh advfirewall set allprofiles
        state off}
- id: neg1
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: powershell.exe, executable: 'C:\Windows\System32\powershell.exe', command_line: powershell Get-MpPreference}
- id: neg2
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: sc.exe, executable: 'C:\Windows\System32\sc.exe', command_line: sc query windefend}
- id: neg3
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: netsh.exe, executable: 'C:\Windows\System32\netsh.exe', command_line: netsh advfirewall show allprofiles}
