docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: registry, type: change}
    registry:
      path: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\sethc.exe\Debugger
      data:
        strings: ['C:\Windows\System32\cmd.exe']
      value: Debugger
    process: {name: reg.exe}
