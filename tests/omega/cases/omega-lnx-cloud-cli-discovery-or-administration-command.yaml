docs:
- id: aws
  match: true
  doc:
    host:
      os: {type: linux}
      name: srv1
    user: {name: eve}
    event: {category: process, type: start}
    process:
      name: aws
      executable: /usr/bin/aws
      command_line: aws ec2 describe-instances --region eu-west-1
      parent: {name: bash}
- id: az
  match: true
  doc:
