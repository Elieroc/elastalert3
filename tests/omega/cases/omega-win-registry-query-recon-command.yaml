docs:
- id: pw
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: reg.exe
      executable: C:\Windows\System32\reg.exe
      command_line: reg query HKLM /f password /t REG_SZ /s
      parent: {name: explorer.exe}
- id: putty
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: reg.exe
      executable: C:\Windows\System32\reg.exe
      command_line: reg query HKCU\Software\SimonTatham\PuTTY\Sessions
      parent: {name: explorer.exe}
