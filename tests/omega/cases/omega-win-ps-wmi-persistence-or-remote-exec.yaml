docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, code: '4104'}
    powershell:
      file: {script_block_text: 'Set-WmiInstance -Namespace root\subscription -Class CommandLineEventConsumer -Arguments
          @{Name=''x'';CommandLineTemplate=''cmd''}'}
    process: {name: powershell.exe}
- id: pos2
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, code: '4104'}
    powershell:
      file: {script_block_text: Invoke-WmiMethod -Class Win32_Process -Name Create -ArgumentList 'calc'}
    process: {name: powershell.exe}
- id: neg1
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, code: '4104'}
    powershell:
      file: {script_block_text: Get-WmiObject Win32_OperatingSystem}
    process: {name: powershell.exe}
