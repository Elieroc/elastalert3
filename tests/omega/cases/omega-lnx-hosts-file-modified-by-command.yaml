docs:
- id: echo
  match: true
  doc:
    host:
      os: {type: linux}
      name: srv1
    user: {name: eve}
    event: {category: process, type: start}
    process:
      name: bash
      executable: /usr/bin/bash
      command_line: bash -c 'echo 1.2.3.4 update.example.com >> /etc/hosts'
      parent: {name: bash}
- id: tee
  match: true
