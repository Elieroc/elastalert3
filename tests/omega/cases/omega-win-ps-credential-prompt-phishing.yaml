docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, code: '4104'}
    powershell:
      file: {script_block_text: '$c=$host.ui.PromptForCredential("Windows Security","Enter credentials","","")'}
    process: {name: powershell.exe}
- id: pos2
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, code: '4104'}
    powershell:
      file: {script_block_text: $c.GetNetworkCredential().Password}
    process: {name: powershell.exe}
- id: neg1
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, code: '4104'}
    powershell:
      file: {script_block_text: Get-Credential}
    process: {name: powershell.exe}
