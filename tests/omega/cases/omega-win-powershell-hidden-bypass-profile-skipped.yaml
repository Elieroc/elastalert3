docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: powershell.exe, executable: 'C:\Windows\System32\powershell.exe', command_line: powershell -nop -w hidden
        -ep bypass -c x}
- id: pos2
  match: true
