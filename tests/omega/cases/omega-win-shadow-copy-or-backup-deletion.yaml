docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: vssadmin.exe, executable: 'C:\Windows\System32\vssadmin.exe', command_line: vssadmin delete shadows
        /all /quiet}
