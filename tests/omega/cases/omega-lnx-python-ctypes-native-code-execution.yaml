docs:
- id: mmap
  match: true
  doc:
    host:
      os: {type: linux}
      name: srv1
    user: {name: eve}
    event: {category: process, type: start}
    process:
      name: python3
      executable: /usr/bin/python3
      command_line: python3 -c "import ctypes,mmap;m=mmap.mmap(-1,4096,prot=7);f=ctypes.CFUNCTYPE(None)"
      parent: {name: bash}
