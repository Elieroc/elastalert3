docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: registry, type: change}
    registry:
      path: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_DLLs
      data:
        strings: ['C:\Users\Public\x.dll']
      value: AppInit_DLLs
    process: {name: reg.exe}
