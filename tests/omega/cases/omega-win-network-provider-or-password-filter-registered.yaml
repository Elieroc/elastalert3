docs:
- id: order
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    event: {category: registry, type: change}
    registry:
      path: HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\NetworkProvider\Order\ProviderOrder
      data:
        strings: ['RDPNP,LanmanWorkstation,webclient,NPPSpy']
    process: {name: reg.exe}
- id: path
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    event: {category: registry, type: change}
    registry:
      path: HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NPPSpy\NetworkProvider\ProviderPath
      data:
        strings: ['C:\Windows\System32\NPPSpy.dll']
    process: {name: powershell.exe}
- id: install
  match: false
  doc:
    host:
      os: {type: windows}
      name: win1
    event: {category: registry, type: change}
    registry:
      path: HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\NetworkProvider\Order\ProviderOrder
      data:
        strings: ['RDPNP,LanmanWorkstation,webclient']
    process: {name: msiexec.exe}
- id: other
  match: false
  doc:
    host:
      os: {type: windows}
      name: win1
    event: {category: registry, type: change}
    registry:
      path: HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Hostname
      data:
        strings: [win1]
    process: {name: reg.exe}
