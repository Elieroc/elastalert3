docs:
- id: delayed
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: cmd.exe
      executable: C:\Windows\System32\cmd.exe
      command_line: cmd.exe /v:on /c "set a=who&&set b=ami&&!a!!b!"
      parent: {name: explorer.exe}
- id: caret
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: cmd.exe
      executable: C:\Windows\System32\cmd.exe
      command_line: cmd /c p^o^w^e^r^s^h^e^l^l -c calc
      parent: {name: explorer.exe}
- id: pipe
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: cmd.exe
      executable: C:\Windows\System32\cmd.exe
      command_line: cmd /c echo whoami | cmd
      parent: {name: explorer.exe}
- id: sub
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: cmd.exe
      executable: C:\Windows\System32\cmd.exe
      command_line: cmd /c %x:~1,2%%y:~3,2%
      parent: {name: explorer.exe}
- id: plain
  match: false
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: cmd.exe
      executable: C:\Windows\System32\cmd.exe
      command_line: cmd.exe /c dir C:\
      parent: {name: explorer.exe}
- id: caret2
  match: false
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: cmd.exe
      executable: C:\Windows\System32\cmd.exe
      command_line: cmd /c echo a^&b
      parent: {name: explorer.exe}
