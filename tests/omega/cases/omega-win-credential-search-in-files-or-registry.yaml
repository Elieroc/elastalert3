docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: findstr.exe, executable: 'C:\Windows\System32\findstr.exe', command_line: findstr /si password *.txt
        *.xml *.config}
- id: pos2
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: reg.exe, executable: 'C:\Windows\System32\reg.exe', command_line: reg query HKCU /f password /t REG_SZ
        /s}
- id: pos3
  match: true
  doc:
