    user: {name: alice}
    event: {category: process, type: start}
    process: {name: cmdkey.exe, executable: 'C:\Windows\System32\cmdkey.exe', command_line: cmdkey /list}
- id: pos4
  match: true
  doc:
    host:
      os: {type: windows}
