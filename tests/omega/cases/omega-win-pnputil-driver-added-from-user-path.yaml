docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: pnputil.exe
      executable: 'C:\Windows\System32\pnputil.exe'
      command_line: 'pnputil.exe /add-driver C:\Users\Public\evil.inf /install'
- id: neg1
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: pnputil.exe
      executable: 'C:\Windows\System32\pnputil.exe'
      command_line: 'pnputil.exe /enum-drivers'
