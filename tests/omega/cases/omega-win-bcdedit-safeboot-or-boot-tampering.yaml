    user: {name: alice}
    event: {category: process, type: start}
    process: {name: bcdedit.exe, executable: 'C:\Windows\System32\bcdedit.exe', command_line: bcdedit /enum}
- id: neg2
  doc:
    host:
      os: {type: windows}
      name: win1
