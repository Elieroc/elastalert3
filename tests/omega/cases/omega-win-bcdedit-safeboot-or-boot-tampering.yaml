docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: bcdedit.exe, executable: 'C:\Windows\System32\bcdedit.exe', command_line: 'bcdedit /set {default} safeboot
        network'}
- id: pos2
  match: true
  doc:
