      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: bcdedit.exe, executable: 'C:\Windows\System32\bcdedit.exe', command_line: bcdedit /set testsigning on}
- id: neg1
  doc:
    host:
      os: {type: windows}
