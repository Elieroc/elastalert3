docs:
- id: upn
  match: true
  doc:
    host: {name: win1}
    event: {category: authentication, provider: Microsoft-Windows-Security-Auditing, code: '4887'}
    user: {name: alice}
    winlog:
      event_data: {Requester: CORP\alice, Attributes: 'CertificateTemplate:User

          SAN:upn=administrator@corp.local'}
