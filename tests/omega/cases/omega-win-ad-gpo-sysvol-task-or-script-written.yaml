docs:
- id: task
  match: true
  doc:
    host: {name: win1}
    event: {category: authentication, provider: Microsoft-Windows-Security-Auditing, code: '5145'}
    user: {name: bob.admin}
    winlog:
      event_data: {ShareName: \\*\SYSVOL, RelativeTargetName: 'corp.local\Policies\{ABC}\Machine\Preferences\ScheduledTasks\ScheduledTasks.xml',
        AccessList: '%%4417'}
