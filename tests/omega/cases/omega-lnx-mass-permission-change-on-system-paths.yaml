docs:
- id: chmod
  match: true
  doc:
    host:
      os: {type: linux}
      name: srv1
    user: {name: eve}
    event: {category: process, type: start}
    process:
      name: chmod
      executable: /usr/bin/chmod
      command_line: chmod -R 777 /
      parent: {name: bash}
- id: chown
  match: true
  doc:
    host:
      os: {type: linux}
      name: srv1
    user: {name: eve}
    event: {category: process, type: start}
    process:
      name: chown
      executable: /usr/bin/chown
      command_line: chown -R nobody /etc
      parent: {name: bash}
