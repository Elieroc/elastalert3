docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: registry, type: change}
    registry:
      path: HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\Userinit
      data:
        strings: ['C:\Windows\system32\userinit.exe,C:\Users\Public\a.exe']
      value: Userinit
    process: {name: reg.exe}
