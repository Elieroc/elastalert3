docs:
- id: pos1
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: manage-bde.exe
      executable: C:\Windows\System32\manage-bde.exe
      command_line: 'manage-bde -protectors -disable C:'
      parent: {name: cmd.exe}
- id: pos2
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process:
      name: powershell.exe
      executable: C:\Windows\System32\powershell.exe
      command_line: 'powershell Disable-BitLocker -MountPoint C:'
      parent: {name: explorer.exe}
- id: pos3
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: manage-bde.exe, executable: 'C:\Windows\System32\manage-bde.exe', command_line: 'manage-bde -off C:'}
- id: pos4
  match: true
  doc:
    host:
      os: {type: windows}
      name: win1
    user: {name: alice}
    event: {category: process, type: start}
    process: {name: powershell.exe, executable: 'C:\Windows\System32\powershell.exe', command_line: 'powershell Suspend-BitLocker
