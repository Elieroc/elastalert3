name: omega-win-ad-shadow-credentials-key-link-modified
type: any
index: winlogbeat-*,logs-system.security-*,logs-windows.forwarded-*
timestamp_field: '@timestamp'
priority: 1
mitre_attack: [T1556, T1098]
risk_score: 85
risk_objects: {user: user.name, host: host.name}
filter:
- term: {event.provider: Microsoft-Windows-Security-Auditing}
- term: {event.code: '5136'}
- bool:
    should:
    - term:
        winlog.event_data.AttributeLDAPDisplayName: {value: msDS-KeyCredentialLink, case_insensitive: true}
    minimum_should_match: 1
- term: {winlog.event_data.OperationType: '%%14674'}
- bool:
    must_not:
    - bool:
        should:
        - wildcard:
            user.name: {value: MSOL_*, case_insensitive: true}
        - wildcard:
            user.name: {value: AAD_*, case_insensitive: true}
        - wildcard:
            user.name: {value: SYSTEM, case_insensitive: true}
        minimum_should_match: 1
realert: {minutes: 30}
query_key: [user.name, winlog.event_data.ObjectDN]
alert: [debug]
omega:
  tier: T0
  description: 'A key credential is added to the msDS-KeyCredentialLink attribute of a user or computer object (directory change
    event 5136): shadow credentials, a way to take over an account without knowing its password.'
  source: [auth]
  false_positives: Windows Hello for Business and some Entra ID sync tools write this attribute on purpose. Exclude the sync accounts
    and the hosts that enrol devices.
  references: ['https://github.com/elastic/detection-rules/blob/main/rules/credential_access_shadow_credentials_added_to_ad_object.toml',
    'https://attack.mitre.org/techniques/T1556/']
