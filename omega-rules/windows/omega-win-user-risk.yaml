name: omega-win-user-risk
type: risk
priority: 2
mitre_attack: []
risk_threshold: 100
timeframe: {hours: 24}
risk_object_type: user
min_distinct_rules: 2
realert: {hours: 12}
usual_hours:
  timezone: UTC
  windows:
  - days: [mon, tue, wed, thu, fri]
    from: 07:00
    to: '19:00'
off_hours_bonus: 20
alert: [debug]
omega:
  tier: T2
  description: 'A user account whose alerts add up to 100 risk points within 24 hours, from at least two different rules:
    a compromised or misused account seen across hosts.'
  source: [risk]
  false_positives: Administrators and service accounts that run many noisy tools (exclude them with an exception on the
    rule that feeds them).
  references: ['https://elastalert3.neopipe.fr/ruletypes.html#risk']
