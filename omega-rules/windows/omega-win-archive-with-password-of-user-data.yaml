name: omega-win-archive-with-password-of-user-data
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 4
mitre_attack: [T1560.001]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - term:
        process.name: {value: 7z.exe, case_insensitive: true}
    - term:
        process.name: {value: 7za.exe, case_insensitive: true}
    - term:
        process.name: {value: 7zg.exe, case_insensitive: true}
    - term:
        process.name: {value: rar.exe, case_insensitive: true}
    - term:
        process.name: {value: winrar.exe, case_insensitive: true}
    - term:
        process.name: {value: zip.exe, case_insensitive: true}
    - term:
        process.name: {value: pkzip.exe, case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - wildcard:
        process.command_line: {value: '* -p*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '* -hp*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '* -mhe*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*-p"*', case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - wildcard:
        process.command_line: {value: '* a *', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '* -a *', case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - wildcard:
        process.command_line: {value: '*\\documents*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*\\desktop*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*\\users\\*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*\\\\*\\*$*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*\\share*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*\\finance*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*\\hr*', case_insensitive: true}
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'A command-line archiver (7z, rar, winrar, zip) run with a password or header encryption over user document
    folders: data staged for exfiltration.'
  source: [process]
  false_positives: Users protecting an archive of their own files and backup tools. Adds risk only.
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_7zip_password_compression.yml',
    'https://attack.mitre.org/techniques/T1560/001/']
