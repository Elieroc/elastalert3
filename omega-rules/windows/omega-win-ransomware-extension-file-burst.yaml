    - wildcard:
        file.extension: {value: crysis, case_insensitive: true}
    - wildcard:
        file.extension: {value: gandcrab, case_insensitive: true}
    - wildcard:
        file.extension: {value: nemty, case_insensitive: true}
    - wildcard:
        file.extension: {value: clop, case_insensitive: true}
    - wildcard:
        file.extension: {value: avos, case_insensitive: true}
    - wildcard:
        file.extension: {value: avoslocker, case_insensitive: true}
    - wildcard:
        file.extension: {value: cring, case_insensitive: true}
    - wildcard:
        file.extension: {value: ragnar, case_insensitive: true}
    - wildcard:
        file.extension: {value: netwalker, case_insensitive: true}
    - wildcard:
        file.extension: {value: thanos, case_insensitive: true}
    - wildcard:
        file.extension: {value: xorist, case_insensitive: true}
    - wildcard:
        file.extension: {value: stop, case_insensitive: true}
    - wildcard:
        file.extension: {value: encrypted, case_insensitive: true}
    - wildcard:
        file.extension: {value: locked, case_insensitive: true}
    minimum_should_match: 1
num_events: 30
timeframe: {minutes: 1}
query_key: [host.name]
realert: {minutes: 30}
alert: [debug]
omega:
  tier: T0
  description: '30 or more files created or renamed with a known ransomware extension (.lockbit, .akira, .basta, .royal,
    .hive, .ryk, .encrypted, ...) by one host in one minute: encryption in progress.'
  source: [file]
  false_positives: Archives or backups that legitimately use a name like .locked or .encrypted at volume (exclude by process
    or path). The count keeps single files from firing.
  references: ['https://attack.mitre.org/techniques/T1486/']
