name: omega-win-browser-remote-debugging-session-hijack
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1185, T1539]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - term:
        process.name: {value: chrome.exe, case_insensitive: true}
    - term:
        process.name: {value: msedge.exe, case_insensitive: true}
    - term:
        process.name: {value: brave.exe, case_insensitive: true}
    - term:
        process.name: {value: vivaldi.exe, case_insensitive: true}
    - term:
        process.name: {value: opera.exe, case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - wildcard:
        process.command_line: {value: '*--remote-debugging-port*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*--remote-debugging-pipe*', case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - wildcard:
        process.command_line: {value: '*--user-data-dir*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*--headless*', case_insensitive: true}
    minimum_should_match: 1
realert: {minutes: 10}
query_key: [host.name, user.name]
alert: []
omega:
  tier: T1
  description: 'A browser started with a remote debugging port, often headless and with the real profile: attackers use it to
    read cookies and session data of a logged-in user, or to drive the user session.'
  source: [process]
  false_positives: 'Developers and test automation (Chromedriver, Playwright). Silent: it adds risk.'
  references: ['https://attack.mitre.org/techniques/T1185/', 'https://attack.mitre.org/techniques/T1539/']
