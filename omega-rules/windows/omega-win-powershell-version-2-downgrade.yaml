name: omega-win-powershell-version-2-downgrade
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1689]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - term:
        process.name: {value: powershell.exe, case_insensitive: true}
    - term:
        process.name: {value: pwsh.exe, case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - wildcard:
        process.command_line: {value: '* -version 2*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '* -v 2*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '* -ver 2*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '* /version 2*', case_insensitive: true}
    minimum_should_match: 1
realert: {minutes: 10}
query_key: [host.name, user.name]
alert: []
omega:
  tier: T1
  description: 'PowerShell is started with -Version 2: the old engine has no script block logging, no AMSI and no constrained
    language mode, so attackers downgrade to it to run code unseen.'
  source: [process]
  false_positives: 'Old scripts that require version 2 (rare; the engine is an optional feature that is off on current systems).
    Silent: it adds risk.'
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_powershell_downgrade_attack.yml',
    'https://github.com/elastic/detection-rules/blob/main/rules/windows/defense_evasion_posh_downgrade.toml', 'https://attack.mitre.org/techniques/T1689/']
