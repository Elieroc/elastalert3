name: omega-win-ad-dns-wildcard-or-wpad-record-created
type: any
index: winlogbeat-*,logs-system.security-*,logs-windows.forwarded-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1557]
risk_score: 80
risk_objects: {user: user.name, host: host.name}
filter:
- term: {event.provider: Microsoft-Windows-Security-Auditing}
- term: {event.code: '5137'}
- bool:
    should:
    - term:
        winlog.event_data.ObjectClass: {value: dnsNode, case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - regexp:
        winlog.event_data.ObjectDN: {value: 'DC=\*,.*', case_insensitive: true}
    - regexp:
        winlog.event_data.ObjectDN: {value: 'DC=wpad,.*', case_insensitive: true}
    minimum_should_match: 1
realert: {minutes: 30}
query_key: [user.name]
alert: [debug]
omega:
  tier: T0
  description: 'A DNS record named * or wpad is created in an Active Directory integrated zone (event 5137, class dnsNode): any
    authenticated user can do it, and the record sends the traffic of the domain to a host that captures credentials (ADIDNS poisoning).'
  source: [auth]
  false_positives: Almost none. A wildcard record is rare and wpad is only created on purpose by administrators of proxy auto-config
    (exclude them).
  references: ['https://attack.mitre.org/techniques/T1557/']
