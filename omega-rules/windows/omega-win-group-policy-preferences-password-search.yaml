name: omega-win-group-policy-preferences-password-search
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1552.006, T1552.001]
risk_score: 75
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - wildcard:
        process.command_line: {value: '*cpassword*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*get-gpppassword*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*gpp-decrypt*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*groups.xml*sysvol*', case_insensitive: true}
    minimum_should_match: 1
realert: {minutes: 30}
query_key: [host.name, user.name]
alert: [debug]
omega:
  tier: T0
  description: 'A command that searches for or reads the cpassword attribute of Group Policy Preferences (findstr /S cpassword
    \\domain\SYSVOL, Get-GPPPassword, gpp-decrypt): the passwords are encrypted with a key that Microsoft published.'
  source: [process]
  false_positives: Security audits that look for exposed GPP passwords (exclude the audit host).
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_findstr_gpp_passwords.yml',
    'https://attack.mitre.org/techniques/T1552/006/']
