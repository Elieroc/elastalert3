name: omega-win-credential-search-in-files-or-registry
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 4
mitre_attack: [T1552.001, T1552.002, T1555.004]
risk_score: 15
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: findstr.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*password*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*passw*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*pwd*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*cpassword*', case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '* /s*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* /si*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* -s*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: reg.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '* query *', case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '* /f password*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* /f pass*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*/t reg_sz /s*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: cmdkey.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '* /list*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: vaultcmd.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*/listcreds*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* /list*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: powershell.exe, case_insensitive: true}
            - term:
                process.name: {value: pwsh.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*select-string*password*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*get-childitem*unattend*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*sysprep.xml*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*groups.xml*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        should:
        - wildcard:
            process.command_line: {value: '*\\unattend.xml*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*\\sysprep\\sysprep.xml*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*\\sysvol\\*\\groups.xml*', case_insensitive: true}
        minimum_should_match: 1
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'A search for passwords: findstr/dir/Select-String for password in files, reg query /f password, cmdkey /list,
    vaultcmd /listcreds, or opening unattend.xml / sysprep files.'
  source: [process]
  false_positives: Administrators searching configuration. Adds risk only.
  references: ['https://attack.mitre.org/techniques/T1552/001/', 'https://attack.mitre.org/techniques/T1552/002/', 'https://attack.mitre.org/techniques/T1555/004/']
