name: omega-win-network-provider-or-password-filter-registered
type: any
index: logs-endpoint.events.registry*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1556.008, T1556.002, T1556]
risk_score: 80
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: registry}
- terms:
    event.type: [change, creation]
- bool:
    should:
    - wildcard:
        registry.path: {value: '*\\Control\\NetworkProvider\\Order\\ProviderOrder', case_insensitive: true}
    - wildcard:
        registry.path: {value: '*\\Services\\*\\NetworkProvider\\ProviderPath', case_insensitive: true}
    minimum_should_match: 1
- bool:
    must_not:
    - bool:
        should:
        - term:
            process.name: {value: msiexec.exe, case_insensitive: true}
        - term:
            process.name: {value: trustedinstaller.exe, case_insensitive: true}
        - term:
            process.name: {value: svchost.exe, case_insensitive: true}
        minimum_should_match: 1
realert: {minutes: 30}
query_key: [host.name, registry.path]
alert: [debug]
omega:
  tier: T0
  description: A network provider DLL is registered (NetworkProvider\Order, or a ProviderPath under Services\*\NetworkProvider),
    the way credential-stealing providers such as NPPSpy capture clear-text passwords at logon.
  source: [registry]
  false_positives: Remote access and file-sync products that install a real network provider (exclude their value, they are few).
    The registry rule for LSA packages covers password filters.
  references: ['https://attack.mitre.org/techniques/T1556/008/', 'https://attack.mitre.org/techniques/T1556/002/']
