name: omega-win-rdp-enabled-or-nla-disabled-registry
type: any
index: logs-endpoint.events.registry*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1021.001, T1112]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: registry}
- terms:
    event.type: [change, creation]
- bool:
    should:
    - bool:
        must:
        - bool:
            should:
            - wildcard:
                registry.path: {value: '*\\Control\\Terminal Server\\fDenyTSConnections', case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                registry.data.strings: {value: '0', case_insensitive: true}
            - wildcard:
                registry.data.strings: {value: '0x00000000', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - wildcard:
                registry.path: {value: '*\\WinStations\\RDP-Tcp\\UserAuthentication', case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                registry.data.strings: {value: '0', case_insensitive: true}
            - wildcard:
                registry.data.strings: {value: '0x00000000', case_insensitive: true}
            minimum_should_match: 1
    minimum_should_match: 1
- bool:
    must_not:
    - bool:
        should:
        - term:
            process.name: {value: msiexec.exe, case_insensitive: true}
        - term:
            process.name: {value: TiWorker.exe, case_insensitive: true}
        - term:
            process.name: {value: TrustedInstaller.exe, case_insensitive: true}
        - term:
            process.name: {value: setup.exe, case_insensitive: true}
        - term:
            process.name: {value: ccmexec.exe, case_insensitive: true}
        - term:
            process.name: {value: MsMpEng.exe, case_insensitive: true}
        - term:
            process.name: {value: svchost.exe, case_insensitive: true}
        - term:
            process.name: {value: wuauclt.exe, case_insensitive: true}
        - term:
            process.name: {value: dism.exe, case_insensitive: true}
        - term:
            process.name: {value: dismhost.exe, case_insensitive: true}
        - term:
            process.name: {value: OfficeClickToRun.exe, case_insensitive: true}
        - term:
            process.name: {value: Teams.exe, case_insensitive: true}
        - term:
            process.name: {value: OneDriveSetup.exe, case_insensitive: true}
        minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: Remote Desktop switched on (fDenyTSConnections = 0) or network-level authentication turned off (UserAuthentication
    = 0).
  source: [registry]
  false_positives: Administrators enabling RDP on a new server. Adds risk only; on a workstation it is worth a look.
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_terminal_server_tampering.yml',
    'https://attack.mitre.org/techniques/T1021/001/', 'https://attack.mitre.org/techniques/T1112/']
