name: omega-win-group-policy-object-attribute-modified
type: any
index: winlogbeat-*,logs-system.security-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1484.001, T1484]
risk_score: 10
risk_objects: {host: host.name, user: winlog.event_data.SubjectUserName}
filter:
- term: {event.provider: Microsoft-Windows-Security-Auditing}
- term: {event.code: '5136'}
- term: {winlog.event_data.ObjectClass: groupPolicyContainer}
- bool:
    should:
    - term:
        winlog.event_data.AttributeLDAPDisplayName: {value: gPCFileSysPath, case_insensitive: true}
    - term:
        winlog.event_data.AttributeLDAPDisplayName: {value: versionNumber, case_insensitive: true}
    - term:
        winlog.event_data.AttributeLDAPDisplayName: {value: gPCMachineExtensionNames, case_insensitive: true}
    - term:
        winlog.event_data.AttributeLDAPDisplayName: {value: gPCUserExtensionNames, case_insensitive: true}
    minimum_should_match: 1
realert: {minutes: 10}
query_key: [winlog.event_data.ObjectDN]
alert: []
omega:
  tier: T1
  description: 'A Group Policy Object is changed in Active Directory (directory service change 5136 on a groupPolicyContainer:
    version number, file system path or extension list).'
  source: [domain controller]
  false_positives: 'Every GPO edit by an administrator. Silent: it adds risk, and the GPO abuse tool rule alerts on the offensive
    tools. Needs the audit of directory service changes on the GPO container.'
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_susp_gpo_modification.yml',
    'https://attack.mitre.org/techniques/T1484/001/']
