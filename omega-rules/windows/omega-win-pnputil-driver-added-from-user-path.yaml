name: omega-win-pnputil-driver-added-from-user-path
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1068, T1547.006]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - term:
        process.name: {value: pnputil.exe, case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - wildcard:
        process.command_line: {value: '*/add-driver*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*-a *', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '* /a *', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*/install*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*-i *', case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - wildcard:
        process.command_line: {value: '*\\users\\public\\*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*\\appdata\\*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*\\temp\\*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*\\programdata\\*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*\\perflogs\\*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*\\\\*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*http://*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*https://*', case_insensitive: true}
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'pnputil adding a driver package from a user-writable or remote path: how vulnerable-driver (BYOVD) attacks load their driver.'
  source: [process]
  false_positives: 'Driver installers unpacked into Temp. Exclude by parent.'
  references: ['https://lolbas-project.github.io/lolbas/Binaries/Pnputil/', 'https://attack.mitre.org/techniques/T1068/']
