name: omega-win-browser-credential-store-copied
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1555.003]
risk_score: 25
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: cmd.exe, case_insensitive: true}
            - term:
                process.name: {value: powershell.exe, case_insensitive: true}
            - term:
                process.name: {value: pwsh.exe, case_insensitive: true}
            - term:
                process.name: {value: copy.exe, case_insensitive: true}
            - term:
                process.name: {value: xcopy.exe, case_insensitive: true}
            - term:
                process.name: {value: robocopy.exe, case_insensitive: true}
            - term:
                process.name: {value: esentutl.exe, case_insensitive: true}
            - term:
                process.name: {value: findstr.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*\\user data\\default\\login data*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*\\user data\\local state*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*\\logins.json*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*\\key4.db*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*\\cookies.sqlite*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*\\user data\\default\\network\\cookies*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*\\user data\\default\\web data*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        should:
        - term:
            process.name: {value: sharpchrome.exe, case_insensitive: true}
        - term:
            process.name: {value: chromepass.exe, case_insensitive: true}
        - term:
            process.name: {value: webbrowserpassview.exe, case_insensitive: true}
        - term:
            process.name: {value: chromepasswordsdumper.exe, case_insensitive: true}
        minimum_should_match: 1
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: A command copies or reads browser credential stores (Chrome/Edge Login Data and Local State, Firefox logins.json
    and key4.db) or a tool such as SharpChrome runs.
  source: [process]
  false_positives: Profile migration and backup tools. Adds risk only.
  references: ['https://attack.mitre.org/techniques/T1555/003/']
