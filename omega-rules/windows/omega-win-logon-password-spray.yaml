name: omega-win-logon-password-spray
type: cardinality
index: winlogbeat-*,logs-system.security-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1110.003, T1087.002]
risk_score: 25
risk_objects: {ip: source.ip}
filter:
- term: {event.provider: Microsoft-Windows-Security-Auditing}
- term: {event.code: '4625'}
- exists: {field: source.ip}
- exists: {field: user.name}
cardinality_field: user.name
max_cardinality: 9
timeframe: {minutes: 10}
query_key: source.ip
realert: {minutes: 30}
alert: []
omega:
  tier: T1
  description: 'One source address failing Windows logons against 10 or more different accounts within 10 minutes: password
    spraying or account enumeration.'
  source: [auth]
  false_positives: Vulnerability scanners and shared proxies (exclude them). Adds risk only.
  references: ['https://attack.mitre.org/techniques/T1110/003/', 'https://attack.mitre.org/techniques/T1087/002/']
