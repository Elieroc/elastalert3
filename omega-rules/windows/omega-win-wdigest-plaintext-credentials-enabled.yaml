name: omega-win-wdigest-plaintext-credentials-enabled
type: any
index: logs-endpoint.events.registry*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1112, T1003.001]
risk_score: 80
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: registry}
- terms:
    event.type: [change, creation]
- bool:
    should:
    - wildcard:
        registry.path: {value: '*\\Control\\SecurityProviders\\WDigest\\UseLogonCredential', case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - wildcard:
        registry.data.strings: {value: '1', case_insensitive: true}
    - wildcard:
        registry.data.strings: {value: '0x00000001', case_insensitive: true}
    minimum_should_match: 1
alert: [debug]
omega:
  tier: T0
  description: 'WDigest UseLogonCredential set to 1: clear-text passwords kept in lsass memory again, a step before credential
    dumping.'
  source: [registry]
  false_positives: Legacy applications that need WDigest (very rare).
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/registry/registry_set/registry_set_wdigest_enable_uselogoncredential.yml',
    'https://attack.mitre.org/techniques/T1112/', 'https://attack.mitre.org/techniques/T1003/001/']
