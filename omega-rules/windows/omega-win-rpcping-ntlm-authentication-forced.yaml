name: omega-win-rpcping-ntlm-authentication-forced
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1187, T1557.001]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - term:
        process.name: {value: rpcping.exe, case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - wildcard:
        process.command_line: {value: '* -s *', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '* /s *', case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - wildcard:
        process.command_line: {value: '*ntlm*', case_insensitive: true}
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'rpcping -s host with NTLM: forces a Windows host to authenticate to a chosen server, the way to coerce and capture an NTLM hash.'
  source: [process]
  false_positives: 'Network troubleshooting of RPC endpoints. Exclude by user.'
  references: ['https://lolbas-project.github.io/lolbas/Binaries/Rpcping/', 'https://attack.mitre.org/techniques/T1187/']
