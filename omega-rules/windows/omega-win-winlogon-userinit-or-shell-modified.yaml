name: omega-win-winlogon-userinit-or-shell-modified
type: any
index: logs-endpoint.events.registry*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1547.004]
risk_score: 75
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: registry}
- terms:
    event.type: [change, creation]
- bool:
    should:
    - wildcard:
        registry.path: {value: '*\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\Userinit', case_insensitive: true}
    - wildcard:
        registry.path: {value: '*\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\Shell', case_insensitive: true}
    - wildcard:
        registry.path: {value: '*\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\AppSetup', case_insensitive: true}
    - wildcard:
        registry.path: {value: '*\\Microsoft\\Windows NT\\CurrentVersion\\Winlogon\\Taskman', case_insensitive: true}
    minimum_should_match: 1
- bool:
    must_not:
    - bool:
        should:
        - bool:
            should:
            - wildcard:
                registry.data.strings: {value: 'c:\\windows\\system32\\userinit.exe,', case_insensitive: true}
            - wildcard:
                registry.data.strings: {value: explorer.exe, case_insensitive: true}
            - wildcard:
                registry.data.strings: {value: 'c:\\windows\\system32\\userinit.exe', case_insensitive: true}
            minimum_should_match: 1
        minimum_should_match: 1
alert: [debug]
omega:
  tier: T0
  description: 'Winlogon Userinit, Shell, AppSetup or Notify value changed to something other than the defaults: a program
    launched at every logon by the system itself.'
  source: [registry]
  false_positives: Kiosk and thin-client configurations that replace the shell on purpose (exclude those hosts).
  references: ['https://attack.mitre.org/techniques/T1547/004/']
