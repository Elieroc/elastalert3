name: omega-win-ad-kerberos-password-spray-from-one-source
type: cardinality
index: winlogbeat-*,logs-system.security-*,logs-windows.forwarded-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1110.003]
risk_score: 75
risk_objects: {ip: source.ip}
filter:
- term: {event.provider: Microsoft-Windows-Security-Auditing}
- term: {event.code: '4771'}
- bool:
    should:
    - term:
        winlog.event_data.Status: {value: '0x18', case_insensitive: true}
    minimum_should_match: 1
cardinality_field: user.name
max_cardinality: 9
timeframe: {minutes: 10}
query_key: [source.ip]
realert: {minutes: 30}
alert: [debug]
omega:
  tier: T0
  description: 'One source address fails the Kerberos pre-authentication (event 4771, status 0x18, wrong password) for 10 or more
    different accounts within 10 minutes: a password spray over Kerberos, which does not show as 4625.'
  source: [auth]
  false_positives: A misconfigured service that retries with the wrong password for many accounts, a vulnerability scanner. Exclude
    by source.
  references: ['https://attack.mitre.org/techniques/T1110/003/']
