name: omega-win-known-ransom-note-created
type: any
index: logs-endpoint.events.file*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 1
mitre_attack: [T1486]
risk_score: 90
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: file}
- terms:
    event.type: [creation, change]
- bool:
    should:
    - wildcard:
        file.name: {value: Restore-My-Files.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: How To Restore Your Files.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: HOW_TO_DECRYPT.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: HOW_TO_DECRYPT_FILES.html, case_insensitive: true}
    - wildcard:
        file.name: {value: HOW_TO_RECOVER_FILES*.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: HOW_TO_RESTORE_FILES*.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: HOW_TO_BACK_FILES.html, case_insensitive: true}
    - wildcard:
        file.name: {value: RyukReadMe.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: RyukReadMe.html, case_insensitive: true}
    - wildcard:
        file.name: {value: RyukReadMe.hta, case_insensitive: true}
    - wildcard:
        file.name: {value: '@Please_Read_Me@.txt', case_insensitive: true}
    - wildcard:
        file.name: {value: '@WanaDecryptor@.exe', case_insensitive: true}
    - wildcard:
        file.name: {value: '@WanaDecryptor@.bmp', case_insensitive: true}
    - wildcard:
        file.name: {value: '@WanaDecryptor@.exe.lnk', case_insensitive: true}
    - wildcard:
        file.name: {value: '!!!READ_ME_MEDUSA!!!.txt', case_insensitive: true}
    - wildcard:
        file.name: {value: '!README!.txt', case_insensitive: true}
    - wildcard:
        file.name: {value: '!!FAQ for Decryption!!.txt', case_insensitive: true}
    - wildcard:
        file.name: {value: '!_README_!*.txt', case_insensitive: true}
    - wildcard:
        file.name: {value: '*-readme.txt', case_insensitive: true}
    - wildcard:
        file.name: {value: akira_readme.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: ClopReadMe.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: read_me_lkd.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: DECRYPT-FILES.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: DECRYPT-FILES.html, case_insensitive: true}
    - wildcard:
        file.name: {value: DECRYPT_INSTRUCTION*.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: DECRYPT_FILES.html, case_insensitive: true}
    - wildcard:
        file.name: {value: _DECRYPT_FILE.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: RESTORE_FILES_INFO.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: README_TO_RESTORE*, case_insensitive: true}
    - wildcard:
        file.name: {value: README_FOR_DECRYPT.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: CONTI_README.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: BlackByte_restoremyfiles.hta, case_insensitive: true}
    - wildcard:
        file.name: {value: Contact Us.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: CriticalBreachDetected.pdf, case_insensitive: true}
    - wildcard:
        file.name: {value: README-RECOVER-*.txt, case_insensitive: true}
    - wildcard:
