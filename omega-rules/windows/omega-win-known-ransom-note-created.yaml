    - wildcard:
        file.name: {value: RECOVERY INFORMATION.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: ransom.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: ransom.html, case_insensitive: true}
    - wildcard:
        file.name: {value: how_to_decrypt.html, case_insensitive: true}
    - wildcard:
        file.name: {value: _readme.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: HELP_DECRYPT*, case_insensitive: true}
    - wildcard:
        file.name: {value: HELP_YOUR_FILES*, case_insensitive: true}
    - wildcard:
        file.name: {value: YOUR_FILES_ARE_ENCRYPTED*, case_insensitive: true}
    - wildcard:
        file.name: {value: Your_Files_Are_Encrypted*, case_insensitive: true}
    - wildcard:
        file.name: {value: ALL_YOUR_FILES_ARE_ENCRYPTED*, case_insensitive: true}
    - wildcard:
        file.name: {value: FILES_ENCRYPTED.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: READ_ME_NOW.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: Readme_to_decrypt*.txt, case_insensitive: true}
    - wildcard:
        file.name: {value: HOW-TO-DECRYPT-FILES*, case_insensitive: true}
    - wildcard:
        file.name: {value: ReadMeToDecrypt*, case_insensitive: true}
    - wildcard:
        file.name: {value: LockBit-Ransomware.hta, case_insensitive: true}
    minimum_should_match: 1
alert: [debug]
omega:
  tier: T0
  description: 'A file with the name of a known ransom note is created: LockBit, Ryuk, WannaCry, Conti, Medusa, Akira, Clop,
    Hive, Babuk, REvil, BlackByte, Rhysida, Cuba and other Windows ransomware families. Generic names (readme.txt, README.md)
    are left out on purpose.'
  source: [file]
  false_positives: 'Almost none: the names are specific. A security-training share or a malware-analysis sandbox that stores
    these files can match; exclude those hosts.'
  references: ['https://attack.mitre.org/techniques/T1486/']
