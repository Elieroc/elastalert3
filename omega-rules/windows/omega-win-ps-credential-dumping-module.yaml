name: omega-win-ps-credential-dumping-module
type: any
index: winlogbeat-*,logs-windows.powershell_operational-*
timestamp_field: '@timestamp'
priority: 1
mitre_attack: [T1003, T1558.003]
risk_score: 90
risk_objects: {host: host.name, user: user.name}
filter:
- term: {event.code: '4104'}
- bool:
    should:
    - wildcard:
        powershell.file.script_block_text: {value: '*invoke-mimikatz*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*dumpcreds*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*sekurlsa::*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*lsadump::*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*invoke-kerberoast*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*get-gpppassword*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*out-minidump*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*invoke-dcsync*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*invoke-ninjacopy*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*get-vaultcredential*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*invoke-credentialinjection*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*get-lsasecret*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*dump-lsass*', case_insensitive: true}
    minimum_should_match: 1
alert: [debug]
omega:
  tier: T0
  description: 'PowerShell script block with Mimikatz or other credential-theft code: Invoke-Mimikatz, DumpCreds, sekurlsa,
    lsadump, Invoke-Kerberoast, Get-GPPPassword, Out-Minidump, Invoke-DCSync.'
  source: [powershell]
  false_positives: Red-team scripts. Detection-engineering test strings.
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/powershell/powershell_script/posh_ps_potential_invoke_mimikatz.yml',
    'https://attack.mitre.org/techniques/T1003/', 'https://attack.mitre.org/techniques/T1558/003/']
