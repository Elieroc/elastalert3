name: omega-win-scheduled-task-created-from-command-line
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 4
mitre_attack: [T1053.005]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - term:
        process.name: {value: schtasks.exe, case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - wildcard:
        process.command_line: {value: '* /create*', case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - bool:
        should:
        - wildcard:
            process.command_line: {value: '*/ru system*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*/ru "system"*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*/ru "nt authority\\system"*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*/sc minute*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*/sc onlogon*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*/sc onstart*', case_insensitive: true}
        minimum_should_match: 1
    - bool:
        should:
        - wildcard:
            process.command_line: {value: '*powershell*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*cmd /c*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*wscript*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*cscript*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*mshta*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*rundll32*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*regsvr32*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*\\appdata\\*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*\\temp\\*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*\\users\\public\\*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*\\programdata\\*', case_insensitive: true}
        minimum_should_match: 1
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: schtasks creating a task that runs as SYSTEM, every minute, or a script/interpreter from a user-writable
    folder.
  source: [process]
  false_positives: Installers and management scripts that create tasks. Adds risk only.
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_schtasks_creation.yml',
    'https://attack.mitre.org/techniques/T1053/005/']
