name: omega-win-ad-dsrm-account-password-set
type: any
index: winlogbeat-*,logs-system.security-*,logs-windows.forwarded-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1098]
risk_score: 75
risk_objects: {user: user.name, host: host.name}
filter:
- term: {event.provider: Microsoft-Windows-Security-Auditing}
- term: {event.code: '4794'}
realert: {minutes: 30}
query_key: [host.name]
alert: [debug]
omega:
  tier: T0
  description: 'The password of the Directory Services Restore Mode (DSRM) administrator is set on a domain controller (event
    4794): a local account that works even when the directory is down, a favourite backdoor.'
  source: [auth]
  false_positives: The planned reset of this password. Rare.
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_dsrm_password_change.yml']
