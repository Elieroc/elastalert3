name: omega-win-application-shim-installed
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1546.011]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - term:
        process.name: {value: sdbinst.exe, case_insensitive: true}
    minimum_should_match: 1
- bool:
    must_not:
    - bool:
        should:
        - wildcard:
            process.command_line: {value: '* -u *', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '* -n *', case_insensitive: true}
        minimum_should_match: 1
realert: {minutes: 10}
query_key: [host.name, user.name]
alert: []
omega:
  tier: T1
  description: 'A custom application shim database is installed with sdbinst.exe: a shim can inject a DLL into a program or disable
    its protections, and stays after reboot.'
  source: [process]
  false_positives: 'Application compatibility fixes deployed by administrators for old software. Silent: it adds risk.'
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_sdbinst_shim_persistence.yml',
    'https://attack.mitre.org/techniques/T1546/011/']
