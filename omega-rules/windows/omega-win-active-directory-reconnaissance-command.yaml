name: omega-win-active-directory-reconnaissance-command
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 4
mitre_attack: [T1087.002, T1482, T1018]
risk_score: 5
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: nltest.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*domain_trusts*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*dclist*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*dsgetdc*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*trusted_domains*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: net.exe, case_insensitive: true}
            - term:
                process.name: {value: net1.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '* group *', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* localgroup *', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* view *', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* accounts *', case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*/domain*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*domain admins*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*enterprise admins*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*administrators*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        should:
        - term:
            process.name: {value: dsquery.exe, case_insensitive: true}
        - term:
            process.name: {value: adfind.exe, case_insensitive: true}
        - term:
            process.name: {value: ldifde.exe, case_insensitive: true}
        - term:
            process.name: {value: csvde.exe, case_insensitive: true}
        minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: setspn.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '* -q *', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* -t *', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* -l *', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* -f *', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: powershell.exe, case_insensitive: true}
            - term:
                process.name: {value: pwsh.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*get-adcomputer*-filter*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*get-aduser*-filter*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*get-adgroupmember*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*get-addomain*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*get-adforest*', case_insensitive: true}
            minimum_should_match: 1
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'Active Directory and network reconnaissance by command: nltest /domain_trusts or /dclist, net group "domain
    admins" /domain, dsquery, AdFind, setspn -Q/-T, net view /domain, Get-ADComputer/-ADUser enumeration.'
  source: [process]
  false_positives: Administrators. Tiny risk; a burst next to other signals is the point.
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_nltest_recon.yml',
    'https://attack.mitre.org/techniques/T1087/002/', 'https://attack.mitre.org/techniques/T1482/', 'https://attack.mitre.org/techniques/T1018/']
