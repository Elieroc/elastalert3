name: omega-win-dcom-lateral-movement-activity
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1021.003, T1559.001]
risk_score: 75
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - bool:
        must:
        - bool:
            should:
            - term:
                process.parent.name: {value: mmc.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.parent.command_line: {value: '*-embedding*', case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - term:
                process.name: {value: cmd.exe, case_insensitive: true}
            - term:
                process.name: {value: powershell.exe, case_insensitive: true}
            - term:
                process.name: {value: pwsh.exe, case_insensitive: true}
            - term:
                process.name: {value: wscript.exe, case_insensitive: true}
            - term:
                process.name: {value: cscript.exe, case_insensitive: true}
            - term:
                process.name: {value: mshta.exe, case_insensitive: true}
            - term:
                process.name: {value: rundll32.exe, case_insensitive: true}
            - term:
                process.name: {value: regsvr32.exe, case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: powershell.exe, case_insensitive: true}
            - term:
                process.name: {value: pwsh.exe, case_insensitive: true}
            - term:
                process.name: {value: cmd.exe, case_insensitive: true}
            - term:
                process.name: {value: wscript.exe, case_insensitive: true}
            - term:
                process.name: {value: cscript.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*mmc20.application*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*shellwindows*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*shellbrowserwindow*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*49b2791a-b1ae-4c90-9b8e-e860ba07f889*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*9ba05972-f6a8-11cf-a442-00a0c90a8f39*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*c08afd90-f2a1-11d1-8455-00a0c91f3880*', case_insensitive: true}
            minimum_should_match: 1
    minimum_should_match: 1
realert: {minutes: 30}
query_key: [host.name]
alert: [debug]
omega:
  tier: T0
  description: 'DCOM abuse for lateral movement: a shell or script host started by mmc.exe -Embedding (MMC20.Application on the
    target), or a command line that instantiates MMC20.Application, ShellWindows or ShellBrowserWindow objects (by name or by
    CLSID).'
  source: [process]
  false_positives: 'Almost none: administrators do not drive MMC through COM from a command line, and mmc.exe launched with -Embedding
    does not start shells in normal use.'
  references: ['https://github.com/elastic/detection-rules/blob/main/rules/windows/lateral_movement_incoming_dcom_lateral_movement_with_mmc.toml',
    'https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_mmc_spawn_shell.yml', 'https://attack.mitre.org/techniques/T1021/003/']
