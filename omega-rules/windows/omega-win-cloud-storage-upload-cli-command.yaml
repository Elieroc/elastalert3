name: omega-win-cloud-storage-upload-cli-command
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1537, T1567.002]
risk_score: 12
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - bool:
        should:
        - wildcard:
            process.command_line: {value: '*azcopy*copy*blob.core.windows.net*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*azcopy*sync*blob.core.windows.net*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*gsutil*cp*gs://*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*gsutil*rsync*gs://*', case_insensitive: true}
        - wildcard:
            process.command_line: {value: '*az storage blob upload*', case_insensitive: true}
        minimum_should_match: 1
    - regexp:
        process.command_line: {value: '.*aws s3 (cp|sync|mv)( +-[^ ]+)* +([^s ][^ ]*|s[^3 ][^ ]*|s3[^: ][^ ]*) +s3://.*', case_insensitive: true}
    minimum_should_match: 1
realert: {minutes: 10}
query_key: [host.name, user.name]
alert: []
omega:
  tier: T1
  description: 'A command that copies data to a cloud storage account with a command line client: azcopy, aws s3 cp or sync to
    an s3 bucket, gsutil cp, az storage blob upload, rclone copy to a remote.'
  source: [process]
  false_positives: 'Backups, build pipelines and data teams (exclude the accounts and hosts). Silent: it adds risk, and the destination
    account matters (data moved to an account the company does not own).'
  references: ['https://attack.mitre.org/techniques/T1537/', 'https://attack.mitre.org/techniques/T1567/002/']
