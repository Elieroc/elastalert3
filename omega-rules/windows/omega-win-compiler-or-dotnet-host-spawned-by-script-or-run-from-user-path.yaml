name: omega-win-compiler-or-dotnet-host-spawned-by-script-or-run-from-user-path
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1027.004, T1127]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: csc.exe, case_insensitive: true}
            - term:
                process.name: {value: vbc.exe, case_insensitive: true}
            - term:
                process.name: {value: jsc.exe, case_insensitive: true}
            - term:
                process.name: {value: ilasm.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - term:
                process.parent.name: {value: wscript.exe, case_insensitive: true}
            - term:
                process.parent.name: {value: cscript.exe, case_insensitive: true}
            - term:
                process.parent.name: {value: mshta.exe, case_insensitive: true}
            - term:
                process.parent.name: {value: winword.exe, case_insensitive: true}
            - term:
                process.parent.name: {value: excel.exe, case_insensitive: true}
            - term:
                process.parent.name: {value: powerpnt.exe, case_insensitive: true}
            - term:
                process.parent.name: {value: outlook.exe, case_insensitive: true}
            - term:
                process.parent.name: {value: wmiprvse.exe, case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: dotnet.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*.dll*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*.csproj*', case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*\\users\\public\\*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*\\appdata\\*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*\\temp\\*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*\\programdata\\*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*\\perflogs\\*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*\\\\*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*http://*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*https://*', case_insensitive: true}
            minimum_should_match: 1
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'csc, vbc, jsc or ilasm started by a script host or an Office process (code compiled on the fly), or dotnet.exe running a library or project from a user-writable path.'
  source: [process]
  false_positives: 'Developers; PowerShell Add-Type also starts csc but from powershell.exe, which this rule does not match. Exclude build users.'
  references: ['https://lolbas-project.github.io/lolbas/OtherMSBinaries/Csc/', 'https://lolbas-project.github.io/lolbas/OtherMSBinaries/Vbc/', 'https://lolbas-project.github.io/lolbas/OtherMSBinaries/Jsc/', 'https://lolbas-project.github.io/lolbas/OtherMSBinaries/Ilasm/', 'https://lolbas-project.github.io/lolbas/OtherMSBinaries/Dotnet/', 'https://attack.mitre.org/techniques/T1027/004/']
