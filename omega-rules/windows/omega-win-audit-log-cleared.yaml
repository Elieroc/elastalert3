name: omega-win-audit-log-cleared
type: any
index: winlogbeat-*,logs-system.security-*,logs-system.system-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1685.005]
risk_score: 80
risk_objects: {host: host.name, user: user.name}
filter:
- bool:
    should:
    - term: {event.code: '1102'}
    - bool:
        must:
        - term: {event.code: '104'}
        - term: {event.provider: Microsoft-Windows-Eventlog}
    minimum_should_match: 1
alert: [debug]
omega:
  tier: T0
  description: The Security log (event 1102) or another event log (event 104) was cleared.
  source: [auth]
  false_positives: Planned log maintenance by administrators (exclude the account). Also fires when a log is archived and
    cleared by a collection tool.
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/builtin/security/win_security_audit_log_cleared.yml',
    'https://attack.mitre.org/techniques/T1685/005/']
