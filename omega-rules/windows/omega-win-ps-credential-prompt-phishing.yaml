name: omega-win-ps-credential-prompt-phishing
type: any
index: winlogbeat-*,logs-windows.powershell_operational-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1056.002]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {event.code: '4104'}
- bool:
    should:
    - wildcard:
        powershell.file.script_block_text: {value: '*$host.ui.promptforcredential*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*credui*promptforcredentials*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*get-credential*-message*windows*security*', case_insensitive: true}
    - wildcard:
        powershell.file.script_block_text: {value: '*getnetworkcredential().password*', case_insensitive: true}
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: PowerShell script block that pops a fake credential dialog (Get-Credential with a spoofed message, $host.ui.PromptForCredential,
    CredUIPromptForCredentials) and keeps the answer.
  source: [powershell]
  false_positives: Admin scripts that legitimately ask for credentials. Adds risk only.
  references: ['https://attack.mitre.org/techniques/T1056/002/']
