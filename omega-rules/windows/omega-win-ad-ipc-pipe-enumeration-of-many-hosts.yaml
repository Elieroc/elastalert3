name: omega-win-ad-ipc-pipe-enumeration-of-many-hosts
type: cardinality
index: winlogbeat-*,logs-system.security-*,logs-windows.forwarded-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1087.002, T1069.002, T1018, T1482]
risk_score: 20
risk_objects: {ip: source.ip}
filter:
- term: {event.provider: Microsoft-Windows-Security-Auditing}
- term: {event.code: '5145'}
- bool:
    should:
    - wildcard:
        winlog.event_data.ShareName: {value: '*\\IPC$', case_insensitive: true}
    minimum_should_match: 1
- bool:
    should:
    - term:
        winlog.event_data.RelativeTargetName: {value: srvsvc, case_insensitive: true}
    - term:
        winlog.event_data.RelativeTargetName: {value: samr, case_insensitive: true}
    - term:
        winlog.event_data.RelativeTargetName: {value: wkssvc, case_insensitive: true}
    minimum_should_match: 1
cardinality_field: host.name
max_cardinality: 14
timeframe: {minutes: 10}
query_key: [source.ip]
realert: {minutes: 30}
alert: []
omega:
  tier: T1
  description: 'One source address opens the srvsvc, samr or wkssvc pipe of 15 or more different hosts within 10 minutes (event
    5145 on IPC$): the way BloodHound collectors and net tools list sessions and local admins across the network.'
  source: [auth]
  false_positives: 'Inventory and monitoring tools, vulnerability scanners. Silent: it adds risk. Needs the Detailed File Share
    audit on the hosts.'
  references: ['https://attack.mitre.org/techniques/T1087/002/']
