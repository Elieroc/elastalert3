name: omega-win-ad-managed-service-account-password-read
type: any
index: winlogbeat-*,logs-system.security-*,logs-windows.forwarded-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1555, T1078.002]
risk_score: 75
risk_objects: {user: user.name, host: host.name}
filter:
- term: {event.provider: Microsoft-Windows-Security-Auditing}
- term: {event.code: '4662'}
- bool:
    should:
    - wildcard:
        winlog.event_data.Properties: {value: '*e362ed86-b728-0842-b27d-2dea7a9df218*', case_insensitive: true}
    minimum_should_match: 1
- bool:
    must_not:
    - bool:
        should:
        - wildcard:
            user.name: {value: '*$', case_insensitive: true}
        minimum_should_match: 1
realert: {minutes: 30}
query_key: [user.name]
alert: [debug]
omega:
  tier: T0
  description: 'The msDS-ManagedPassword attribute of a group managed service account is read by an account that is not a computer
    (event 4662): a person or a script that fetches the gMSA password can log in as that service, which often runs with high rights.'
  source: [auth]
  false_positives: Administrators who test a gMSA by hand. Computers read it all the time and are excluded. Needs a SACL for reads
    on the gMSA objects.
  references: ['https://attack.mitre.org/techniques/T1555/']
