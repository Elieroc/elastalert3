name: omega-win-windows-firewall-disabled
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1686.003, T1686]
risk_score: 75
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: netsh.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*advfirewall*state off*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*advfirewall*state=off*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*firewall*set*opmode*disable*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*advfirewall*set*allprofiles*off*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: powershell.exe, case_insensitive: true}
            - term:
                process.name: {value: pwsh.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*set-netfirewallprofile*-enabled*false*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*disable-netfirewallrule*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*netfirewallprofile*enabled false*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: reg.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*firewallpolicy*enablefirewall*', case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*/d 0*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: sc.exe, case_insensitive: true}
            - term:
                process.name: {value: net.exe, case_insensitive: true}
            - term:
                process.name: {value: net1.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '* stop mpssvc*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* stop "windows firewall"*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*config mpssvc*disabled*', case_insensitive: true}
            minimum_should_match: 1
    minimum_should_match: 1
realert: {minutes: 30}
query_key: [host.name, user.name]
alert: [debug]
omega:
  tier: T0
  description: 'A command that turns the Windows host firewall off: netsh advfirewall set allprofiles state off, netsh firewall
    set opmode disable, Set-NetFirewallProfile -Enabled False, EnableFirewall set to 0, or the firewall service stopped.'
  source: [process]
  false_positives: Administrators who disable the firewall for a test (it should be a change ticket anyway). Installers use rules,
    not this.
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_netsh_fw_disable.yml',
    'https://github.com/elastic/detection-rules/blob/main/rules/windows/defense_evasion_disable_windows_firewall_rules_with_netsh.toml',
    'https://attack.mitre.org/techniques/T1686/003/']
