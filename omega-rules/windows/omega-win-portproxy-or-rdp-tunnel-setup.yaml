name: omega-win-portproxy-or-rdp-tunnel-setup
type: any
index: logs-endpoint.events.process*,winlogbeat-*,logs-windows.sysmon_operational-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1090, T1572, T1021.001]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: windows}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: netsh.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*portproxy*add*v4tov4*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*portproxy*add*v4tov6*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: plink.exe, case_insensitive: true}
            - term:
                process.name: {value: ssh.exe, case_insensitive: true}
            - term:
                process.name: {value: putty.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '* -R *', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* -L *', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* -D *', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*-ssh*-R*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: netsh.exe, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*firewall*add*rule*', case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*localport=3389*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*localport=445*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*localport=5985*', case_insensitive: true}
            minimum_should_match: 1
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'A port forward or tunnel set up for remote access: netsh portproxy v4tov4, plink/ssh with -R/-L, firewall
    rule opening 3389 or 445 from anywhere.'
  source: [process]
  false_positives: Administrators creating forwards for a service. Adds risk only.
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_netsh_port_forwarding.yml',
    'https://attack.mitre.org/techniques/T1090/', 'https://attack.mitre.org/techniques/T1572/', 'https://attack.mitre.org/techniques/T1021/001/']
