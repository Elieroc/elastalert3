# elastalert3 config using omega-rules. Copy it, set the Elasticsearch connection, and keep only the packs you have data for.
# Each pack is its own folder; every rule is self-contained.
rules_folder:
- omega-rules/linux
# - omega-rules/windows
# - omega-rules/web
# - omega-rules/firewall
scan_subdirectories: true
es_host: localhost
es_port: 9200
writeback_index: elastalert
run_every: {minutes: 1}
buffer_time: {minutes: 15}
# T0 and T2 rules use `alert: [debug]`; replace it in the rules (sed -i 's/^alert: \[debug\]/alert: [slack]/' omega-rules/linux/*.yaml). T1 rules are silent.
