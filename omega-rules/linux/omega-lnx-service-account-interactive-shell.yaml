name: omega-lnx-service-account-interactive-shell
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1059.004, T1078.003]
risk_score: 80
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- terms:
    user.name: [www-data, apache, nginx, httpd, tomcat, postgres, mysql, mongodb, redis, jenkins, git, nobody, daemon]
- terms:
    process.name: [bash, sh, dash, zsh, ksh]
- bool:
    should:
    - wildcard: {process.command_line: '* -i*'}
    - wildcard: {process.command_line: '* --login*'}
    - wildcard: {process.command_line: '* -l'}
    minimum_should_match: 1
alert: [debug]
omega:
  tier: T0
  description: 'A service account (www-data, nginx, postgres, mysql, tomcat, jenkins...) running an interactive shell (-i):
    nobody types at the keyboard of a service account.'
  source: [process]
  false_positives: 'Administrators using `su -s /bin/bash www-data` to debug: they run as their own user first, so exclude
    those hosts if needed.'
  references: ['https://attack.mitre.org/techniques/T1059/004/', 'https://attack.mitre.org/techniques/T1078/003/']
