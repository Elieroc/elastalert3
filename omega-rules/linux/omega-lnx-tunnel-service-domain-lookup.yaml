omega:
  tier: T1
  description: 'DNS lookup of a tunnelling, reverse-proxy or overlay-network service domain from the LOTTunnels list (Cloudflare tunnel hostnames, Dev Tunnels, bore, burrow, localhost.run, pinggy, tailscale, zerotier, interactsh oast, tmate and others). The domains of the older c2-or-tunnel-service lookup rule are not repeated.'
  source: [network]
  false_positives: 'Developers and admins using Tailscale, ZeroTier, NetBird, Twingate, Dev Tunnels or Cloudflare tunnels (exclude by host); Tailscale and ZeroTier names also appear on every host that runs them.'
  references: ['https://lottunnels.github.io/domains.csv', 'https://attack.mitre.org/techniques/T1572/']
