name: omega-lnx-credential-and-suid-hunting
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1552.001, T1083, T1548.001]
risk_score: 15
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    must:
    - terms:
        process.name: [find, grep, egrep, locate, mlocate, fgrep]
    - bool:
        should:
        - wildcard: {process.command_line: '*find /*-perm -4000*'}
        - wildcard: {process.command_line: '*find /*-perm -u=s*'}
        - wildcard: {process.command_line: '*find /*-perm /4000*'}
        - wildcard: {process.command_line: '*find /*-name id_rsa*'}
        - wildcard: {process.command_line: '*find /*-name *.pem*'}
        - wildcard: {process.command_line: '*find /*-name *.kdbx*'}
        - wildcard: {process.command_line: '*find /*-name .bash_history*'}
        - wildcard: {process.command_line: '*find /*-name authorized_keys*'}
        - wildcard: {process.command_line: '*grep -r*password*'}
        - wildcard: {process.command_line: '*grep -ri*password*'}
        - wildcard: {process.command_line: '*grep -ir*passw*'}
        - wildcard: {process.command_line: '*locate id_rsa*'}
        - wildcard: {process.command_line: '*find /*-name *password*'}
        minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'Filesystem searches for credentials (find / -name id_rsa, grep -r password /, *.kdbx) or for SUID binaries
    (find / -perm -4000): enumeration before privilege escalation.'
  source: [process]
  false_positives: Compliance scanners, security audit scripts. Adds risk.
  references: ['https://attack.mitre.org/techniques/T1552/001/', 'https://attack.mitre.org/techniques/T1083/', 'https://attack.mitre.org/techniques/T1548/001/']
