name: omega-lnx-executable-from-temp-directory
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1059.004, T1036]
risk_score: 25
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - wildcard: {process.executable: /tmp/*}
    - wildcard: {process.executable: /var/tmp/*}
    - wildcard: {process.executable: /run/user/*}
    minimum_should_match: 1
- bool:
    must_not:
    - terms:
        process.parent.name: [dpkg, rpm, yum, dnf, apt, apt-get, snapd, pip, pip3, npm, cargo, make, gcc, cc, ld, cmake,
          docker, containerd, runc, puppet, chef-client, ansible-playbook]
alert: []
omega:
  tier: T1
  description: A binary started straight out of /tmp, /var/tmp or /run/user (not through an interpreter).
  source: [process]
  false_positives: Installers, build and test tooling, some self-updating agents. Exclude known build hosts. Adds risk;
    the hidden and shared-memory variants are alerts.
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_curl_wget_exec_tmp.yml',
    'https://attack.mitre.org/techniques/T1059/004/', 'https://attack.mitre.org/techniques/T1036/']
