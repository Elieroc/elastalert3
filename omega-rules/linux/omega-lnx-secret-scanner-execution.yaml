name: omega-lnx-secret-scanner-execution
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1552.001]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- terms:
    process.name: [trufflehog, gitleaks, gitrob, detect-secrets, ggshield]
alert: []
omega:
  tier: T1
  description: 'A secret-hunting tool started: trufflehog, gitleaks, gitrob, detect-secrets, ggshield. Used by developers,
    and by attackers who stole a workstation or CI runner.'
  source: [process]
  false_positives: Developer and CI security scanning (exclude the CI user). Adds risk.
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_pua_trufflehog.yml',
    'https://attack.mitre.org/techniques/T1552/001/']
