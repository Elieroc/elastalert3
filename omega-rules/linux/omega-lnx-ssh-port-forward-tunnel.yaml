name: omega-lnx-ssh-port-forward-tunnel
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1572, T1090.001]
risk_score: 15
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    must:
    - terms:
        process.name: [ssh, autossh]
    - bool:
        should:
        - wildcard: {process.command_line: '* -R *'}
        - wildcard: {process.command_line: '* -L *'}
        - wildcard: {process.command_line: '* -D *'}
        - wildcard: {process.command_line: '*-fN*'}
        - wildcard: {process.command_line: '*-NR*'}
        - wildcard: {process.command_line: '*-NL*'}
        - wildcard: {process.command_line: '*-ND*'}
        minimum_should_match: 1
    - bool:
        should:
        - wildcard: {process.command_line: '* -N *'}
        - wildcard: {process.command_line: '*-fN*'}
        - wildcard: {process.command_line: '*-NT*'}
        - wildcard: {process.command_line: '*-NR*'}
        - wildcard: {process.command_line: '*-NL*'}
        - wildcard: {process.command_line: '*-ND*'}
        minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'ssh started only to forward ports (-R, -L, -D with -N): a tunnel or SOCKS proxy through the host.'
  source: [process]
  false_positives: Developers and admins reaching internal services, database tunnels. Adds risk.
  references: ['https://attack.mitre.org/techniques/T1572/', 'https://attack.mitre.org/techniques/T1090/001/']
