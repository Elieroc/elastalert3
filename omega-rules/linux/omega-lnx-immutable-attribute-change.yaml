name: omega-lnx-immutable-attribute-change
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1222.002, T1564]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    must:
    - terms:
        process.name: [chattr]
    - bool:
        should:
        - wildcard: {process.command_line: '*chattr -i*'}
        - wildcard: {process.command_line: '*chattr +i*'}
        - wildcard: {process.command_line: '*chattr +a*'}
        - wildcard: {process.command_line: '*chattr -a*'}
        - wildcard: {process.command_line: '*chattr -R -i*'}
        - wildcard: {process.command_line: '*chattr -R +i*'}
        minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'chattr changing the immutable (+i/-i) or append-only attribute: protecting an implant or freeing a protected
    file.'
  source: [process]
  false_positives: Hardening scripts protecting their own files (+i on config). Adds risk.
  references: ['https://github.com/elastic/detection-rules/blob/main/rules/linux/defense_evasion_chattr_immutable_file.toml',
    'https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_chattr_immutable_removal.yml',
    'https://attack.mitre.org/techniques/T1222/002/', 'https://attack.mitre.org/techniques/T1564/']
