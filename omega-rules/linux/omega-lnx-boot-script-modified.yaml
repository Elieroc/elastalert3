name: omega-lnx-boot-script-modified
type: any
index: logs-endpoint.events.file*,auditbeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1037.004, T1547.013]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: file}
- terms:
    event.type: [creation, change, rename]
- bool:
    must_not:
    - terms:
        process.name: [dpkg, apt, apt-get, apt-key, aptitude, rpm, yum, dnf, microdnf, zypper, pacman, apk, snapd, snap,
          unattended-upgr, packagekitd, update-alternatives, dpkg-deb, rpmdb, cloud-init, systemd-tmpfiles]
- bool:
    should:
    - wildcard: {file.path: /etc/rc.local}
    - wildcard: {file.path: /etc/init.d/*}
    - wildcard: {file.path: '/etc/rc[0-6S].d/*'}
    - wildcard: {file.path: /etc/update-motd.d/*}
    - wildcard: {file.path: /etc/xdg/autostart/*}
    - wildcard: {file.path: '*/.config/autostart/*'}
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'Boot or login hook created or changed: rc.local, init.d, rc*.d, update-motd.d, XDG autostart.'
  source: [file]
  false_positives: Software installs and admins; adds risk only.
  references: ['https://attack.mitre.org/techniques/T1037/004/', 'https://attack.mitre.org/techniques/T1547/013/']
