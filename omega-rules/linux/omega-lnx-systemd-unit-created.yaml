name: omega-lnx-systemd-unit-created
type: any
index: logs-endpoint.events.file*,auditbeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1543.002, T1053.006]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: file}
- terms:
    event.type: [creation, change, rename]
- bool:
    must_not:
    - terms:
        process.name: [dpkg, apt, apt-get, apt-key, aptitude, rpm, yum, dnf, microdnf, zypper, pacman, apk, snapd, snap,
          unattended-upgr, packagekitd, update-alternatives, dpkg-deb, rpmdb, cloud-init, systemd-tmpfiles]
- bool:
    should:
    - wildcard: {file.path: /etc/systemd/system/*.service}
    - wildcard: {file.path: /etc/systemd/system/*.timer}
    - wildcard: {file.path: /usr/lib/systemd/system/*.service}
    - wildcard: {file.path: /lib/systemd/system/*.service}
    - wildcard: {file.path: '*/.config/systemd/user/*.service'}
    - wildcard: {file.path: '*/.config/systemd/user/*.timer'}
    - wildcard: {file.path: /etc/systemd/system/*/*.conf}
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: systemd service or timer unit created or changed outside a package (system or per-user).
  source: [file]
  false_positives: Software installed by hand and configuration management; adds risk only.
  references: ['https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_systemd_service_creation.toml',
    'https://github.com/SigmaHQ/sigma/blob/master/rules/linux/auditd/path/lnx_auditd_systemd_service_creation.yml', 'https://attack.mitre.org/techniques/T1543/002/',
    'https://attack.mitre.org/techniques/T1053/006/']
