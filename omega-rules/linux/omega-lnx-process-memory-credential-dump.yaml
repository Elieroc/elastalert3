name: omega-lnx-process-memory-credential-dump
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1003.007, T1555.005]
risk_score: 85
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - bool:
        must:
        - terms:
            process.name: [cat, dd, strings, grep, xxd, hexdump, python, python3, perl, od]
        - bool:
            should:
            - wildcard: {process.command_line: '*/proc/*/mem*'}
            minimum_should_match: 1
    - bool:
        must:
        - terms:
            process.name: [gdb, gcore]
        - bool:
            should:
            - wildcard: {process.command_line: '*sshd*'}
            - wildcard: {process.command_line: '*ssh-agent*'}
            - wildcard: {process.command_line: '*gnome-keyring*'}
            - wildcard: {process.command_line: '*sudo*'}
            - wildcard: {process.command_line: '*vault*'}
            - wildcard: {process.command_line: '*keepass*'}
            minimum_should_match: 1
    minimum_should_match: 1
alert: [debug]
omega:
  tier: T0
  description: 'Credentials read from process memory: dd/cat/strings on /proc/<pid>/mem, or gdb/gcore attached to sshd,
    ssh-agent, sudo or a keyring.'
  source: [process]
  false_positives: Debugging of a crashing service by an administrator (gdb on sshd is still unusual).
  references: ['https://github.com/elastic/detection-rules/blob/main/rules/linux/credential_access_manual_memory_dumping.toml',
    'https://attack.mitre.org/techniques/T1003/007/', 'https://attack.mitre.org/techniques/T1555/005/']
