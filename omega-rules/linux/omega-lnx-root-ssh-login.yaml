name: omega-lnx-root-ssh-login
type: any
index: logs-system.auth-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1078.003, T1021.004]
risk_score: 20
risk_objects: {ip: source.ip, user: user.name}
filter:
- term: {event.category: authentication}
- term: {event.action: ssh_login}
- term: {event.outcome: success}
- term: {user.name: root}
alert: []
omega:
  tier: T1
  description: Direct SSH login as root (PermitRootLogin in use).
  source: [auth]
  false_positives: Hosts where root login is a deliberate practice (appliances, lab). Adds risk.
  references: ['https://attack.mitre.org/techniques/T1078/003/', 'https://attack.mitre.org/techniques/T1021/004/']
