name: omega-lnx-share-group-and-password-policy-discovery-command
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 4
mitre_attack: [T1135, T1069.001, T1201]
risk_score: 3
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - bool:
        should:
        - term:
            process.name: {value: showmount, case_insensitive: true}
        - term:
            process.name: {value: smbmap, case_insensitive: true}
        - term:
            process.name: {value: enum4linux, case_insensitive: true}
        - term:
            process.name: {value: enum4linux-ng, case_insensitive: true}
        - term:
            process.name: {value: rpcclient, case_insensitive: true}
        - term:
            process.name: {value: nbtscan, case_insensitive: true}
        minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: smbclient, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '* -l*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* --list*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '* -n*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: exportfs, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '* -v*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: getent, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '* group*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: chage, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '* -l*', case_insensitive: true}
            minimum_should_match: 1
    - bool:
        must:
        - bool:
            should:
            - term:
                process.name: {value: cat, case_insensitive: true}
            - term:
                process.name: {value: grep, case_insensitive: true}
            - term:
                process.name: {value: less, case_insensitive: true}
            - term:
                process.name: {value: head, case_insensitive: true}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard:
                process.command_line: {value: '*/etc/group*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*/etc/login.defs*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*pwquality.conf*', case_insensitive: true}
            - wildcard:
                process.command_line: {value: '*pass_max_days*', case_insensitive: true}
            minimum_should_match: 1
    minimum_should_match: 1
realert: {minutes: 5}
query_key: [host.name, user.name]
alert: []
omega:
  tier: T1
  description: A command that lists network shares (showmount -e, smbclient -L, smbmap, enum4linux, rpcclient, exportfs -v), reads
    local groups (getent group, cat /etc/group) or the password policy (chage -l, /etc/login.defs, pwquality.conf).
  source: [process]
  false_positives: Administrators and configuration management. Tiny risk.
  references: ['https://attack.mitre.org/techniques/T1135/', 'https://attack.mitre.org/techniques/T1069/001/', 'https://attack.mitre.org/techniques/T1201/']
