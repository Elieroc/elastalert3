name: omega-lnx-ssh-password-spray
type: cardinality
index: logs-system.auth-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1110.003, T1087.001]
risk_score: 25
risk_objects: {ip: source.ip}
filter:
- term: {event.category: authentication}
- term: {event.action: ssh_login}
- term: {event.outcome: failure}
cardinality_field: user.name
max_cardinality: 7
timeframe: {minutes: 10}
query_key: source.ip
realert: {minutes: 30}
alert: []
omega:
  tier: T1
  description: 'One source address failing SSH logins against 8 or more different accounts within ten minutes: password
    spraying or user enumeration.'
  source: [auth]
  false_positives: Vulnerability scanners and jump hosts shared by many people (exclude them). Adds risk only.
  references: ['https://github.com/elastic/detection-rules/blob/main/rules/linux/credential_access_potential_password_spraying_attack.toml',
    'https://attack.mitre.org/techniques/T1110/003/', 'https://attack.mitre.org/techniques/T1087/001/']
