name: omega-lnx-ssh-password-login-then-key-or-secret-access
type: correlation
index: logs-system.auth-*,filebeat-*,logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 1
mitre_attack: [T1098.004, T1552.004, T1552.005, T1078]
risk_score: 80
risk_objects: {host: host.name, user: user.name}
query_key: [host.name, user.name]
timeframe: {minutes: 10}
realert: {minutes: 30}
correlation_leaves:
  login:
    filter:
    - term: {event.category: authentication}
    - term: {event.action: ssh_login}
    - term: {event.outcome: success}
    - term: {system.auth.ssh.method: password}
  post:
    filter:
    - term: {event.category: process}
    - term: {event.type: start}
    - bool:
        should:
        - bool:
            must:
            - bool:
                should:
                - wildcard: {process.command_line: '*.ssh/authorized_keys*'}
                minimum_should_match: 1
            - bool:
                should:
                - wildcard: {process.command_line: '*>>*'}
                - wildcard: {process.command_line: '*tee *'}
                - wildcard: {process.command_line: '* cp *'}
                - wildcard: {process.command_line: '* mv *'}
                - wildcard: {process.command_line: '*ssh-rsa*'}
                - wildcard: {process.command_line: '*ssh-ed25519*'}
                - wildcard: {process.command_line: '*ecdsa-sha2*'}
                - wildcard: {process.command_line: '*sed -i*'}
                minimum_should_match: 1
        - bool:
            must:
            - terms:
                process.name: [curl, wget]
            - bool:
                should:
                - wildcard: {process.command_line: '*169.254.169.254*'}
                - wildcard: {process.command_line: '*100.100.100.200*'}
                - wildcard: {process.command_line: '*metadata.google.internal*'}
                - wildcard: {process.command_line: '*169.254.170.2*'}
                minimum_should_match: 1
        - bool:
            must:
            - terms:
                process.name: [cat, cp, base64, tar, head, tail, less, more, xxd, scp]
            - bool:
                should:
                - wildcard: {process.command_line: '*/etc/shadow*'}
                - wildcard: {process.command_line: '*/root/.ssh/id_*'}
                - wildcard: {process.command_line: '*/.ssh/id_rsa*'}
                - wildcard: {process.command_line: '*/.ssh/id_ed25519*'}
                minimum_should_match: 1
        minimum_should_match: 1
correlation_query: login THEN post
alert: [debug]
omega:
  tier: T0
  description: 'An account that logged in over SSH with a password runs, within 10 minutes, a command that plants an SSH
    key, reads password hashes or private keys, or queries a cloud metadata service: the first actions seen after the SSHole
    authentication bypass (CVE-2026-123158) and after other stolen-password intrusions.'
  source: [auth, process]
  false_positives: Administrators who log in with a password and immediately add a key or read credentials on a new server
    (a bootstrap script). Restrict to accounts without password logins, or exclude provisioning accounts.
  references: ['https://attack.mitre.org/techniques/T1098/004/', 'https://attack.mitre.org/techniques/T1552/004/', 'https://attack.mitre.org/techniques/T1552/005/',
    'https://attack.mitre.org/techniques/T1078/']
