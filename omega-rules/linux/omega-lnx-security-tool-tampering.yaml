alert: [debug]
omega:
  tier: T0
  description: A security agent, audit or log service stopped, disabled or killed (auditd, rsyslog, EDR agents, firewall,
    fail2ban), auditd rules deleted or SELinux set permissive.
  source: [process]
  false_positives: Package upgrades stopping a service in their maintenance scripts, planned maintenance windows. Exclude
    by process.parent.name or add an active_hours window.
  references: ['https://github.com/elastic/detection-rules/blob/main/rules/linux/defense_evasion_attempt_to_disable_auditd_service.toml',
    'https://github.com/elastic/detection-rules/blob/main/rules/linux/defense_evasion_disable_selinux_attempt.toml', 'https://attack.mitre.org/techniques/T1685/',
    'https://attack.mitre.org/techniques/T1686/']
