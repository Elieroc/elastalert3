name: omega-lnx-socat-or-netcat-relay
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1090, T1572]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - bool:
        must:
        - terms:
            process.name: [socat]
        - bool:
            should:
            - wildcard: {process.command_line: '*TCP-LISTEN:*TCP:*'}
            - wildcard: {process.command_line: '*TCP4-LISTEN:*TCP4:*'}
            - wildcard: {process.command_line: '*tcp-listen:*tcp:*'}
            - wildcard: {process.command_line: '*TCP-LISTEN:*EXEC:*'}
            minimum_should_match: 1
    - bool:
        must:
        - terms:
            process.name: [nc, ncat, netcat]
        - bool:
            should:
            - wildcard: {process.command_line: '* -l*'}
            - wildcard: {process.command_line: '*--listen*'}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard: {process.command_line: '*| nc *'}
            - wildcard: {process.command_line: '*|nc *'}
            - wildcard: {process.command_line: '* -c *'}
            - wildcard: {process.command_line: '* -e *'}
            minimum_should_match: 1
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: socat or netcat used as a listening relay or port redirector (TCP-LISTEN ... TCP:, nc -l ... | nc).
  source: [process]
  false_positives: Network troubleshooting, test environments. Adds risk.
  references: ['https://attack.mitre.org/techniques/T1090/', 'https://attack.mitre.org/techniques/T1572/']
