name: omega-lnx-ssh-password-login-for-root-or-system-account
type: any
index: logs-system.auth-*,filebeat-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1078.003, T1190]
risk_score: 25
risk_objects: {user: user.name, ip: source.ip, host: host.name}
filter:
- term: {event.category: authentication}
- term: {event.action: ssh_login}
- term: {event.outcome: success}
- term: {system.auth.ssh.method: password}
- terms:
    user.name: [root, daemon, bin, sys, sync, games, man, lp, mail, news, uucp, proxy, www-data, backup, list, irc, nobody,
      systemd-network, systemd-resolve, sshd, postgres, mysql, mongodb, redis, git, jenkins, nginx, apache, tomcat, ftp,
      operator, halt, shutdown]
alert: []
omega:
  tier: T1
  description: 'A successful SSH password login (not a key) for root or a system/service account. Such accounts normally
    have a locked password; a password login for them is what an authentication bypass looks like (SSHole, CVE-2026-123158,
    OpenSSH on musl systems such as Alpine, fixed in 10.6p2: accounts whose shadow password is `*` accept an oversized password).'
  source: [auth]
  false_positives: Administrators who still log in as root with a password (fix the configuration), and appliances that
    use service accounts with passwords. Adds risk only. The log line format of the exploit is not published, so the rule
    relies on the successful password login being logged like any other.
  references: ['https://attack.mitre.org/techniques/T1078/003/', 'https://attack.mitre.org/techniques/T1190/']
