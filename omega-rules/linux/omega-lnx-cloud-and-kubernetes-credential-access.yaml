name: omega-lnx-cloud-and-kubernetes-credential-access
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1552.001, T1528]
risk_score: 25
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    must:
    - terms:
        process.name: [cat, cp, head, tail, less, more, base64, tar, scp, dd, strings, vi, vim, nano, grep, awk, sed, xxd,
          zip, curl, rsync]
    - bool:
        should:
        - wildcard: {process.command_line: '*/.aws/credentials*'}
        - wildcard: {process.command_line: '*/.aws/config*'}
        - wildcard: {process.command_line: '*/.azure/accessTokens*'}
        - wildcard: {process.command_line: '*/.config/gcloud/*credentials*'}
        - wildcard: {process.command_line: '*/.config/gcloud/access_tokens*'}
        - wildcard: {process.command_line: '*/.kube/config*'}
        - wildcard: {process.command_line: '*/.docker/config.json*'}
        - wildcard: {process.command_line: '*/.git-credentials*'}
        - wildcard: {process.command_line: '*/.netrc*'}
        - wildcard: {process.command_line: '*/.npmrc*'}
        - wildcard: {process.command_line: '*/.pypirc*'}
        - wildcard: {process.command_line: '*/.vault-token*'}
        - wildcard: {process.command_line: '*/var/run/secrets/kubernetes.io/serviceaccount/token*'}
        - wildcard: {process.command_line: '*/var/lib/kubelet/kubeconfig*'}
        minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'A reading or copying tool opens cloud or cluster credentials: ~/.aws/credentials, ~/.azure, gcloud credentials,
    ~/.kube/config, ~/.docker/config.json, .git-credentials, .netrc, .npmrc, .vault-token, or a Kubernetes service-account
    token.'
  source: [process]
  false_positives: Backup and deployment scripts that read their own credentials, DevOps users. Adds risk.
  references: ['https://github.com/elastic/detection-rules/blob/main/rules/linux/credential_access_kubernetes_and_cloud_credential_paths_via_process_args.toml',
    'https://attack.mitre.org/techniques/T1552/001/', 'https://attack.mitre.org/techniques/T1528/']
