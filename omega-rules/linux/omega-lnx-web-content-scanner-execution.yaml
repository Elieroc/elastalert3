name: omega-lnx-web-content-scanner-execution
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1595.002, T1595.003]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- terms:
    process.name: [gobuster, ffuf, dirb, dirsearch, wfuzz, feroxbuster, whatweb, wpscan, wafw00f, amass, subfinder]
alert: []
omega:
  tier: T1
  description: 'Web content and subdomain discovery tool started: gobuster, ffuf, dirb, dirsearch, wfuzz, feroxbuster, whatweb,
    wpscan, wafw00f, amass, subfinder.'
  source: [process]
  false_positives: Application security teams and bug-bounty researchers on their own hosts (exclude them). Adds risk.
  references: ['https://attack.mitre.org/techniques/T1595/002/', 'https://attack.mitre.org/techniques/T1595/003/']
