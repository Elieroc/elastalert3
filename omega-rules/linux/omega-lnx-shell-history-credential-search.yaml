name: omega-lnx-shell-history-credential-search
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 4
mitre_attack: [T1552.003]
risk_score: 15
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    must:
    - terms:
        process.name: [cat, grep, egrep, fgrep, less, more, head, tail, awk, sed, strings]
    - bool:
        should:
        - wildcard: {process.command_line: '*/.bash_history*'}
        - wildcard: {process.command_line: '*/.zsh_history*'}
        - wildcard: {process.command_line: '*/.sh_history*'}
        - wildcard: {process.command_line: '*/.mysql_history*'}
        - wildcard: {process.command_line: '*/.psql_history*'}
        - wildcard: {process.command_line: '*/.python_history*'}
        minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'A tool reads a shell or database history file (.bash_history, .zsh_history, .mysql_history, .psql_history):
    passwords typed on a command line.'
  source: [process]
  false_positives: Users checking their own history with cat. Adds a small risk.
  references: ['https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_susp_history_recon.yml',
    'https://attack.mitre.org/techniques/T1552/003/']
