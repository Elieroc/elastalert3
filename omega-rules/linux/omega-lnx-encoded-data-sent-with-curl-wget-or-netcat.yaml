name: omega-lnx-encoded-data-sent-with-curl-wget-or-netcat
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1132.001, T1048, T1041]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - wildcard:
        process.command_line: {value: '*curl*$(*base64*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*curl*|*base64*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*base64*|*curl*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*base64*|*nc *', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*base64*|*ncat *', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*base64*|*wget*--post*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*base64*|*openssl s_client*', case_insensitive: true}
    - wildcard:
        process.command_line: {value: '*wget*--post-data*$(*base64*', case_insensitive: true}
    minimum_should_match: 1
realert: {minutes: 10}
query_key: [host.name, user.name]
alert: []
omega:
  tier: T1
  description: 'A command line that base64-encodes data and sends it with curl, wget, netcat or openssl in the same line: standard
    encoding to hide stolen data or commands in a channel.'
  source: [process]
  false_positives: 'Scripts that post base64 payloads to an API (exclude the script). Silent: it adds risk.'
  references: ['https://attack.mitre.org/techniques/T1132/001/', 'https://attack.mitre.org/techniques/T1048/', 'https://attack.mitre.org/techniques/T1041/']
