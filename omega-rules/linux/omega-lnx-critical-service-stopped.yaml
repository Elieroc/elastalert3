    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: 'A database, web, container or file service stopped, disabled or killed: ransomware stops them to unlock
    files; sabotage looks the same.'
  source: [process]
  false_positives: Planned maintenance. Adds risk; a restart is not matched.
  references: ['https://attack.mitre.org/techniques/T1489/']
