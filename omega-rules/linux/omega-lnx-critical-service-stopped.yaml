name: omega-lnx-critical-service-stopped
type: any
index: logs-endpoint.events.process*,auditbeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1489]
risk_score: 25
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: process}
- term: {event.type: start}
- bool:
    should:
    - bool:
        must:
        - terms:
            process.name: [systemctl, service]
        - bool:
            should:
            - wildcard: {process.command_line: '* stop *'}
            - wildcard: {process.command_line: '* disable *'}
            - wildcard: {process.command_line: '* mask *'}
            minimum_should_match: 1
        - bool:
            should:
            - wildcard: {process.command_line: '* mysql'}
            - wildcard: {process.command_line: '* mysqld'}
            - wildcard: {process.command_line: '* mariadb'}
            - wildcard: {process.command_line: '* postgresql'}
            - wildcard: {process.command_line: '* mongod'}
            - wildcard: {process.command_line: '* redis'}
            - wildcard: {process.command_line: '* redis-server'}
            - wildcard: {process.command_line: '* sqlservr'}
            - wildcard: {process.command_line: '* docker'}
            - wildcard: {process.command_line: '* containerd'}
            - wildcard: {process.command_line: '* kubelet'}
            - wildcard: {process.command_line: '* apache2'}
            - wildcard: {process.command_line: '* nginx'}
            - wildcard: {process.command_line: '* httpd'}
            - wildcard: {process.command_line: '* named'}
            - wildcard: {process.command_line: '* dhcpd'}
            - wildcard: {process.command_line: '* smbd'}
            - wildcard: {process.command_line: '* veeam'}
            - wildcard: {process.command_line: '* vmtoolsd'}
            - wildcard: {process.command_line: '* mysql *'}
            - wildcard: {process.command_line: '* mysqld *'}
