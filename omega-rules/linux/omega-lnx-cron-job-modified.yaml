name: omega-lnx-cron-job-modified
type: any
index: logs-endpoint.events.file*,auditbeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1053.003]
risk_score: 20
risk_objects: {host: host.name, user: user.name}
filter:
- term: {host.os.type: linux}
- term: {event.category: file}
- terms:
    event.type: [creation, change, rename]
- bool:
    must_not:
    - terms:
        process.name: [dpkg, apt, apt-get, apt-key, aptitude, rpm, yum, dnf, microdnf, zypper, pacman, apk, snapd, snap,
          unattended-upgr, packagekitd, update-alternatives, dpkg-deb, rpmdb, cloud-init, systemd-tmpfiles]
- bool:
    should:
    - wildcard: {file.path: /etc/cron.d/*}
    - wildcard: {file.path: /etc/cron.hourly/*}
    - wildcard: {file.path: /etc/cron.daily/*}
    - wildcard: {file.path: /etc/cron.weekly/*}
    - wildcard: {file.path: /etc/cron.monthly/*}
    - wildcard: {file.path: /etc/crontab}
    - wildcard: {file.path: /var/spool/cron/*}
    - wildcard: {file.path: /var/spool/cron/crontabs/*}
    minimum_should_match: 1
alert: []
omega:
  tier: T1
  description: Cron job file created or changed (/etc/cron.*, /etc/crontab, /var/spool/cron).
  source: [file]
  false_positives: Configuration management and admins; adds risk only.
  references: ['https://github.com/elastic/detection-rules/blob/main/rules/linux/persistence_cron_job_creation.toml', 'https://github.com/SigmaHQ/sigma/blob/master/rules/linux/file_event/file_event_lnx_susp_cron_file_created.yml',
    'https://attack.mitre.org/techniques/T1053/003/']
