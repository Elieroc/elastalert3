name: omega-web-remote-file-inclusion-or-ssrf-url-parameter
type: any
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 4
mitre_attack: [T1190, T1105]
risk_score: 10
risk_objects: {ip: source.ip, host: host.name}
filter:
- {term: {event.category: web}}
- bool:
    should:
    - range: {http.response.status_code: {gte: 200, lt: 400}}
    - range: {http.response.status_code: {gte: 500}}
    minimum_should_match: 1
- bool:
    should:
    - wildcard: {url.original: {value: '*=http://*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=https://*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=ftp://*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=smb://*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=file://*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=gopher://*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=dict://*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=ldap://*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=jar:*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=netdoc:*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*%3dhttp%3a%2f%2f*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*%3dhttps%3a%2f%2f*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=http%3a%2f%2f*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=https%3a%2f%2f*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=//*', case_insensitive: true}}
    minimum_should_match: 1
- bool:
    should:
    - wildcard: {url.original: {value: '*.php*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*.asp*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*.jsp*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*.cgi*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=gopher*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=dict*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=ldap*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*=file*', case_insensitive: true}}
    minimum_should_match: 1
realert: {minutes: 10}
query_key: [source.ip]
alert: []
omega:
  tier: T1
  description: 'A parameter value that is itself a URL (http, https, ftp, file, gopher, dict, ldap) in a request that reached
    the application: remote file inclusion or server-side request forgery.'
  source: [web]
  false_positives: 'Redirect and OAuth callbacks, link previews and image proxies: this is common legitimate traffic, hence a
    small risk and no alert.'
  references:
  - https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/discovery_web_server_remote_file_inclusion_activity.toml
  - https://attack.mitre.org/techniques/T1190/
  - https://attack.mitre.org/techniques/T1105/
