name: omega-web-account-used-from-many-addresses
type: cardinality
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 4
mitre_attack: [T1078, T1550.004]
risk_score: 15
risk_objects: {user: user.name, host: host.name}
filter:
- {term: {event.category: web}}
- range: {http.response.status_code: {gte: 200, lt: 300}}
- {exists: {field: user.name}}
cardinality_field: source.ip
max_cardinality: 5
timeframe: {hours: 1}
query_key: user.name
realert: {hours: 1}
alert: []
omega:
  tier: T1
  description: 'One authenticated account is used from 6 or more different source addresses within an hour: a shared or stolen
    account, a stolen session token replayed, or a botnet.'
  source: [web]
  false_positives: Mobile users who change networks, accounts behind a rotating corporate proxy, API keys shared by a service
    (exclude by user).
  references: ['https://attack.mitre.org/techniques/T1550/004/']
