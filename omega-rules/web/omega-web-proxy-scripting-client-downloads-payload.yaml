name: omega-web-proxy-scripting-client-downloads-payload
type: any
index: logs-squid.log-*,logs-zscaler_zia.web-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1105, T1059.001, T1197]
risk_score: 20
risk_objects: {ip: source.ip, user: user.name}
filter:
- {term: {event.category: web}}
- {term: {http.request.method: GET}}
- {terms: {http.response.status_code: [200, 206]}}
- bool:
    should:
    - wildcard: {user_agent.original: {value: '*windowspowershell*', case_insensitive: true}}
    - wildcard: {user_agent.original: {value: microsoft bits*, case_insensitive: true}}
    - wildcard: {user_agent.original: {value: bitsadmin*, case_insensitive: true}}
    - wildcard: {user_agent.original: {value: '*certutil url agent*', case_insensitive: true}}
    - wildcard: {user_agent.original: {value: curl/*, case_insensitive: true}}
    - wildcard: {user_agent.original: {value: wget/*, case_insensitive: true}}
    - wildcard: {user_agent.original: {value: java/*, case_insensitive: true}}
    - wildcard: {user_agent.original: {value: python-urllib*, case_insensitive: true}}
    - wildcard: {user_agent.original: {value: python-requests*, case_insensitive: true}}
    - wildcard: {user_agent.original: {value: go-http-client*, case_insensitive: true}}
    - wildcard: {user_agent.original: {value: winhttp*, case_insensitive: true}}
    minimum_should_match: 1
- regexp:
    url.original:
      value: .*\.(exe|dll|ps1|bat|cmd|vbs|vbe|js|jse|wsf|hta|msi|jar|scr|lnk|iso|img|zip|rar|7z|docm|xlsm|pptm|rtf|sct)([?#].*)?
      flags: NONE
      case_insensitive: true
realert: {minutes: 30}
query_key: [source.ip, url.domain]
alert: []
omega:
  tier: T1
  description: A scripting or transfer client (PowerShell, BITS, certutil, curl, wget, Java, Python, Go, WinHTTP) downloads an
    executable, script or archive through the proxy.
  source: [proxy]
  false_positives: 'Administration scripts, package managers and CI jobs (exclude the user agents or hosts). Silent: adds risk.'
  references:
  - https://github.com/SigmaHQ/sigma/blob/master/rules/web/proxy_generic/proxy_ua_powershell.yml
  - https://github.com/SigmaHQ/sigma/blob/master/rules/web/proxy_generic/proxy_ua_bitsadmin_susp_tld.yml
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1059/001/
