name: omega-web-backup-or-database-dump-downloaded
type: any
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 1
mitre_attack: [T1530, T1005, T1213]
risk_score: 80
risk_objects: {ip: source.ip, host: host.name}
filter:
- {term: {event.category: web}}
- {terms: {http.response.status_code: [200, 206]}}
- range: {http.response.body.bytes: {gte: 100000}}
- regexp:
    url.original:
      value: .*/[^/?]*(backup|bak|dump|database|db|site|www|wwwroot|web|old|archive|export|sql|dbdump)[^/?]*\.(sql|zip|gz|tgz|tar|7z|rar|bak|dump|sqlite|db)(\.gz)?(\?.*)?
      flags: NONE
      case_insensitive: true
realert: {hours: 1}
query_key: [url.original]
alert: [debug]
omega:
  tier: T0
  description: 'A backup or database dump (sql, zip, gz, tar, 7z, bak, sqlite...) named like one is downloaded in full (200, 100
    kB or more): the file was left in the web root and someone found it.'
  source: [web]
  false_positives: Backups published on purpose behind a download page (restrict by path) and release archives named backup*.
    Exclude the exact path.
  references:
  - https://attack.mitre.org/techniques/T1530/
  - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/02-Configuration_and_Deployment_Management_Testing/04-Review_Old_Backup_and_Unreferenced_Files_for_Sensitive_Information
