name: omega-web-out-of-band-callback-domain-in-request
type: any
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1190, T1071.001]
risk_score: 25
risk_objects: {ip: source.ip, host: host.name}
filter:
- {term: {event.category: web}}
- bool:
    should:
    - range: {http.response.status_code: {gte: 200, lt: 400}}
    - range: {http.response.status_code: {gte: 500}}
    minimum_should_match: 1
- bool:
    should:
    - wildcard: {url.original: {value: '*oast.pro*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*oast.me*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*oast.fun*', case_insensitive: true}}
