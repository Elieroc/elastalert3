    - wildcard: {url.original: {value: '*burpcollaborator.net*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*oastify.com*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*dnslog.cn*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*dnslog.link*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*ceye.io*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*requestbin.net*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*pipedream.net*', case_insensitive: true}}
