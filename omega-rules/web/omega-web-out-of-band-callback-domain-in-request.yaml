    - wildcard: {url.original: {value: '*bxss.me*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*xss.ht*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*oob.sh*', case_insensitive: true}}
    - wildcard: {user_agent.original: {value: '*oast.pro*', case_insensitive: true}}
    - wildcard: {user_agent.original: {value: '*oast.me*', case_insensitive: true}}
    - wildcard: {user_agent.original: {value: '*oast.fun*', case_insensitive: true}}
