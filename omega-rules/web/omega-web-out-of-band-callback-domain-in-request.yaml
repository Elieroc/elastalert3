realert: {minutes: 10}
query_key: [source.ip]
alert: []
omega:
  tier: T1
  description: 'A callback domain of an out-of-band testing service (interact.sh, oast.*, burpcollaborator, dnslog, ceye, webhook.site,
    pipedream) in the URL, user agent or referrer: blind injection or SSRF being tested.'
  source: [web]
  false_positives: Developers testing webhooks with webhook.site or pipedream URLs in their own parameters; exclude their addresses.
  references: ['https://github.com/projectdiscovery/interactsh', 'https://attack.mitre.org/techniques/T1190/']
