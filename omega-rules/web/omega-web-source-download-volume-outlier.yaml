name: omega-web-source-download-volume-outlier
type: outlier
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1567, T1119, T1213]
risk_score: 20
risk_objects: {ip: source.ip, host: host.name}
filter:
- {term: {event.category: web}}
- range: {http.response.status_code: {gte: 200, lt: 300}}
query_key: source.ip
metric_agg_key: http.response.body.bytes
metric_agg_type: sum
timeframe: {hours: 1}
outlier_factor: 50
min_population: 10
outlier_reference: median
realert: {hours: 6}
alert: []
omega:
  tier: T1
  description: In the last hour, one source address downloaded at least 50 times the median volume of all the clients of the site
    (at least 10 clients compared).
  source: [web]
  false_positives: 'Mirrors, backup jobs, monitoring that fetches large pages (exclude them). The comparison with peers replaces
    a fixed volume that no two sites share. Silent: adds risk.'
  references: ['https://attack.mitre.org/techniques/T1567/', 'https://attack.mitre.org/techniques/T1119/']
