name: omega-web-proxy-tunnel-service-access
type: any
index: logs-squid.log-*,logs-zscaler_zia.web-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1572, T1090.003, T1567]
risk_score: 15
risk_objects: {ip: source.ip, user: user.name}
filter:
- {term: {event.category: web}}
- bool:
    should:
    - wildcard: {url.domain: {value: '*.ngrok.io', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.ngrok-free.app', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.ngrok-free.dev', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.ngrok.app', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.ngrok.dev', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.trycloudflare.com', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.loca.lt', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.localtunnel.me', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.serveo.net', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.pagekite.me', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.lhr.life', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.localhost.run', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.tunnelmole.net', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.pinggy.io', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.playit.gg', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.telebit.io', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.portmap.io', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.zrok.io', case_insensitive: true}}
    - wildcard: {url.domain: {value: bore.pub, case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.bore.pub', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.share.zrok.io', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*.ply.gg', case_insensitive: true}}
    minimum_should_match: 1
realert: {minutes: 30}
query_key: [source.ip, url.domain]
alert: []
omega:
  tier: T1
  description: 'A proxied request reaches a public tunnelling or reverse proxy service (ngrok, trycloudflare, localtunnel, serveo,
    pagekite, pinggy, zrok...): a way to expose an internal service or to hide a command channel.'
  source: [proxy]
  false_positives: 'Developers who share a local site for a demo (exclude them). Silent: adds risk.'
  references: ['https://lottunnels.github.io/', 'https://attack.mitre.org/techniques/T1572/']
