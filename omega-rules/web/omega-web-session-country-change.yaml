name: omega-web-session-country-change
type: change
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1539, T1550.004, T1078]
risk_score: 20
risk_objects: {user: user.name, ip: source.ip, host: host.name}
filter:
- {term: {event.category: web}}
- range: {http.response.status_code: {gte: 200, lt: 300}}
- {exists: {field: user.name}}
- {exists: {field: source.geo.country_iso_code}}
compare_key: [source.geo.country_iso_code]
ignore_null: true
query_key: user.name
timeframe: {minutes: 30}
realert: {hours: 1}
alert: []
omega:
  tier: T1
  description: 'The same authenticated account makes requests from two different countries within 30 minutes: a stolen session
    cookie or token replayed from another network.'
  source: [web]
  false_positives: 'VPN and proxy exits that change country, mobile users who roam. Needs `user.name` and GeoIP in the access
    log. Silent: adds risk.'
  references: ['https://attack.mitre.org/techniques/T1539/', 'https://attack.mitre.org/techniques/T1550/004/']
