name: omega-web-request-flood-per-source
type: frequency
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 4
mitre_attack: [T1499.002, T1498]
risk_score: 10
risk_objects: {ip: source.ip, host: host.name}
filter:
- {term: {event.category: web}}
num_events: 1500
timeframe: {minutes: 1}
query_key: source.ip
use_terms_query: true
terms_size: 50
use_keyword_postfix: false
realert: {minutes: 30}
alert: []
omega:
  tier: T1
  description: 'One source address sends 1500 or more requests within one minute (25 per second): an application-layer flood or
    an aggressive scraper.'
  source: [web]
  false_positives: Crawlers, monitoring, CDN or proxy addresses that front many users (exclude them, or use the real client address).
  references: ['https://attack.mitre.org/techniques/T1499/002/']
