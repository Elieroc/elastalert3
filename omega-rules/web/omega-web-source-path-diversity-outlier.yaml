name: omega-web-source-path-diversity-outlier
type: outlier
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1595.003, T1083]
risk_score: 20
risk_objects: {ip: source.ip, host: host.name}
filter:
- {term: {event.category: web}}
query_key: source.ip
metric_agg_key: url.original
metric_agg_type: cardinality
timeframe: {hours: 1}
outlier_factor: 30
min_population: 10
outlier_reference: median
realert: {hours: 6}
alert: []
omega:
  tier: T1
  description: 'In the last hour, one source address requested at least 30 times more distinct URLs than the median client of
    the site (at least 10 clients compared): crawling, scraping or content discovery.'
  source: [web]
  false_positives: 'Search engine crawlers and link checkers (exclude them). Silent: adds risk.'
  references: ['https://attack.mitre.org/techniques/T1595/003/']
