name: omega-web-credential-stuffing-many-accounts
type: cardinality
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1110.004, T1110.003]
risk_score: 25
risk_objects: {ip: source.ip, host: host.name}
filter:
- {term: {event.category: web}}
- {terms: {http.response.status_code: [401, 403]}}
- {exists: {field: user.name}}
cardinality_field: user.name
max_cardinality: 7
timeframe: {minutes: 10}
query_key: source.ip
realert: {minutes: 30}
alert: []
omega:
  tier: T1
  description: 'One source address fails authentication (401 or 403) for 8 or more different accounts within 10 minutes: credential
    stuffing or password spraying against a service that logs the user name (HTTP authentication, API gateway).'
  source: [web]
  false_positives: Shared proxies in front of many users; SSO gateways that report all users from one address (exclude them).
    Needs `user.name` in the access log.
  references: ['https://attack.mitre.org/techniques/T1110/004/']
