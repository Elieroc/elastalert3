name: omega-web-proxy-oast-callback-domain
type: any
index: logs-squid.log-*,logs-zscaler_zia.web-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1071.001, T1048]
risk_score: 30
risk_objects: {ip: source.ip, user: user.name}
filter:
- {term: {event.category: web}}
- bool:
    should:
    - wildcard: {url.domain: {value: '*oast.pro*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*oast.me*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*oast.fun*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*oast.live*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*oast.site*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*oast.online*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*interact.sh*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*interactsh*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*burpcollaborator.net*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*oastify.com*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*dnslog.cn*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*dnslog.link*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*ceye.io*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*requestbin.net*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*pipedream.net*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*webhook.site*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*canarytokens.com*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*bxss.me*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*xss.ht*', case_insensitive: true}}
    - wildcard: {url.domain: {value: '*oob.sh*', case_insensitive: true}}
    minimum_should_match: 1
realert: {minutes: 30}
query_key: [source.ip, url.domain]
alert: []
omega:
  tier: T1
  description: 'A proxied request goes to the callback domain of an out-of-band testing service (interact.sh, oast.*, burpcollaborator,
    dnslog, ceye, webhook.site, pipedream): a blind injection or a data exfiltration test calling back.'
  source: [proxy]
  false_positives: Developers who test webhooks with webhook.site or pipedream (exclude them by user).
  references: ['https://github.com/projectdiscovery/interactsh', 'https://attack.mitre.org/techniques/T1071/001/']
