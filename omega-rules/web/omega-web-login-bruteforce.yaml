name: omega-web-login-bruteforce
type: frequency
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1110.001, T1110.004]
risk_score: 20
risk_objects: {ip: source.ip, host: host.name}
filter:
- {term: {event.category: web}}
- {term: {http.request.method: POST}}
- bool:
    should:
    - wildcard: {url.original: {value: '*/login*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/signin*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/sign-in*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/wp-login.php*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/user/login*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/account/login*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/auth/login*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/session*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/j_security_check*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/admin/login*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/oauth/token*', case_insensitive: true}}
    minimum_should_match: 1
- bool:
    should:
    - {terms: {http.response.status_code: [401, 403]}}
    - bool:
        must:
        - {terms: {http.response.status_code: [200]}}
        - bool:
            should:
            - wildcard: {url.original: {value: '*/wp-login.php*', case_insensitive: true}}
            minimum_should_match: 1
    minimum_should_match: 1
num_events: 20
timeframe: {minutes: 5}
query_key: source.ip
realert: {minutes: 30}
alert: []
omega:
  tier: T1
  description: 'One source address posts 20 or more failed logins (401 or 403, or a WordPress login that answered 200) to login
    paths within 5 minutes: password guessing or credential stuffing against a web login.'
  source: [web]
  false_positives: 'Shared NAT or proxy addresses behind which many users mistype passwords (exclude them). Silent: it adds risk,
    and `omega-web-bruteforce-then-successful-login` alerts when the guessing works.'
  references: ['https://attack.mitre.org/techniques/T1110/001/', 'https://attack.mitre.org/techniques/T1110/004/']
