name: omega-web-content-discovery-many-distinct-paths
type: cardinality
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1595.003, T1083]
risk_score: 20
risk_objects: {ip: source.ip, host: host.name}
filter:
- {term: {event.category: web}}
- {term: {http.request.method: GET}}
- {terms: {http.response.status_code: [403, 404]}}
cardinality_field: url.original
max_cardinality: 99
timeframe: {minutes: 5}
query_key: source.ip
realert: {minutes: 30}
exceptions:
- name: monitoring-and-health-check-agents
  reason: load balancers, uptime monitors and probes that request many paths with scripting clients
  match:
    user_agent.original|startswith:
    - ELB-HealthChecker
    - kube-probe
    - GoogleHC
    - Amazon-Route53-Health-Check-Service
    - Pingdom
    - UptimeRobot
    - Zabbix
    - check_http
    - Nagios
    - Datadog
    - StatusCake
    - Site24x7
    - NewRelic
    - Consul
    - HAProxy
    - Blackbox Exporter
    - Prometheus
    - Elastic-Heartbeat
alert: []
omega:
  tier: T1
  description: 'One source address collects 404 or 403 answers for 100 or more different URLs within 5 minutes: directory and
    file brute forcing with a wordlist (gobuster, ffuf, dirsearch).'
  source: [web]
  false_positives: Link checkers and crawlers (exclude them); a broken site map after a release.
  references:
  - https://github.com/elastic/detection-rules/blob/main/rules/cross-platform/reconnaissance_web_server_discovery_or_fuzzing_activity.toml
  - https://attack.mitre.org/techniques/T1595/003/
