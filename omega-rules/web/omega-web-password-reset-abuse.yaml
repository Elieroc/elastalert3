name: omega-web-password-reset-abuse
type: frequency
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 4
mitre_attack: [T1110, T1087, T1498]
risk_score: 15
risk_objects: {ip: source.ip, host: host.name}
filter:
- {term: {event.category: web}}
- {term: {http.request.method: POST}}
- bool:
    should:
    - wildcard: {url.original: {value: '*/forgot*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/reset-password*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/password-reset*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/password/reset*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/password/email*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/lost-password*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*/recover*', case_insensitive: true}}
    - wildcard: {url.original: {value: '*action=lostpassword*', case_insensitive: true}}
    minimum_should_match: 1
num_events: 15
timeframe: {minutes: 10}
query_key: source.ip
realert: {minutes: 30}
alert: []
omega:
  tier: T1
  description: 'One source address posts 15 or more password reset or account recovery requests within 10 minutes: account enumeration
    or mail flooding of a victim.'
  source: [web]
  false_positives: Help-desk tools and shared addresses (exclude them).
  references: ['https://attack.mitre.org/techniques/T1087/']
