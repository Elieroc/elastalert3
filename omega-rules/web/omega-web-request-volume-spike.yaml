name: omega-web-request-volume-spike
type: spike
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 2
mitre_attack: [T1498, T1499.002]
filter:
- {term: {event.category: web}}
spike_height: 5
spike_type: up
timeframe: {minutes: 5}
threshold_cur: 3000
threshold_ref: 10
query_key: host.name
alert_on_new_data: false
realert: {minutes: 30}
alert: [debug]
omega:
  tier: T2
  description: 'The number of requests a web server receives in 5 minutes is at least 5 times the number in the previous 5 minutes,
    and above 3000: a flood, a viral link or a scraping run.'
  source: [web]
  false_positives: 'A campaign mail, a news mention or a batch job: confirm with the traffic sources. Tune threshold_cur to the
    site.'
  references: ['https://attack.mitre.org/techniques/T1498/', 'https://attack.mitre.org/techniques/T1499/002/']
