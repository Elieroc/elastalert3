name: omega-web-cms-user-enumeration
type: any
index: logs-nginx.access-*,logs-apache.access-*,logs-apache_tomcat.access-*,logs-iis.access-*,logs-traefik.access-*,filebeat-*
timestamp_field: '@timestamp'
priority: 4
mitre_attack: [T1087.001, T1595]
risk_score: 8
risk_objects: {ip: source.ip, host: host.name}
filter:
- {term: {event.category: web}}
- bool:
    should:
    - range: {http.response.status_code: {gte: 200, lt: 400}}
    - range: {http.response.status_code: {gte: 500}}
    minimum_should_match: 1
- bool:
    should:
    - regexp: {url.original: {value: '.*[?&]author=[0-9]+(&.*)?', flags: NONE, case_insensitive: true}}
    - bool:
        should:
        - wildcard: {url.original: {value: '*/wp-json/wp/v2/users*', case_insensitive: true}}
        - wildcard: {url.original: {value: '*rest_route=/wp/v2/users*', case_insensitive: true}}
        - wildcard: {url.original: {value: '*rest_route=%2fwp%2fv2%2fusers*', case_insensitive: true}}
        minimum_should_match: 1
    minimum_should_match: 1
realert: {minutes: 30}
query_key: [source.ip]
alert: []
omega:
  tier: T1
  description: 'WordPress user enumeration: ?author=<number> or the REST users endpoint answered 2xx or 3xx.'
  source: [web]
  false_positives: Blog themes with numeric author links; REST clients of the site.
  references: ['https://attack.mitre.org/techniques/T1087/001/']
