name: omega-fw-vpn-password-spray
type: cardinality
index: logs-fortinet_fortigate.log-*,logs-panw.panos-*,logs-cisco_asa.log-*,logs-checkpoint.firewall-*,logs-sophos.xg-*,logs-juniper_srx.log-*,logs-pfsense.log-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1110.003, T1133]
risk_score: 20
risk_objects: {ip: source.ip}
filter:
- term: {event.category: authentication}
- term: {event.outcome: failure}
- bool:
    should:
    - bool:
        should:
        - wildcard:
            event.dataset: {value: '*vpn*', case_insensitive: true}
        minimum_should_match: 1
    - bool:
        should:
        - wildcard:
            event.action: {value: '*vpn*', case_insensitive: true}
        minimum_should_match: 1
    minimum_should_match: 1
- exists: {field: user.name}
cardinality_field: user.name
max_cardinality: 7
timeframe: {minutes: 15}
query_key: source.ip
realert: {minutes: 30}
alert: []
omega:
  tier: T1
  description: 'One address fails VPN logins for 8 or more different accounts within 15 minutes: a password spray against the
    VPN portal.'
  source: [vpn]
  false_positives: 'A shared egress address of a branch where many users reconnect after an outage (exclude it). Silent: it adds
    risk.'
  references: ['https://attack.mitre.org/techniques/T1110/003/']
