name: omega-fw-vpn-account-from-many-addresses
type: cardinality
index: logs-fortinet_fortigate.log-*,logs-panw.panos-*,logs-cisco_asa.log-*,logs-checkpoint.firewall-*,logs-sophos.xg-*,logs-juniper_srx.log-*,logs-pfsense.log-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1078, T1133]
risk_score: 15
risk_objects: {user: user.name, ip: source.ip}
filter:
- term: {event.category: authentication}
- term: {event.outcome: success}
- bool:
    should:
    - bool:
        should:
        - wildcard:
            event.dataset: {value: '*vpn*', case_insensitive: true}
        minimum_should_match: 1
    - bool:
        should:
        - wildcard:
            event.action: {value: '*vpn*', case_insensitive: true}
        minimum_should_match: 1
    minimum_should_match: 1
- exists: {field: user.name}
cardinality_field: source.ip
max_cardinality: 3
timeframe: {hours: 1}
query_key: user.name
realert: {hours: 1}
alert: []
omega:
  tier: T1
  description: 'One VPN account logs in successfully from 4 or more different public addresses within an hour: a shared or stolen
    account.'
  source: [vpn]
  false_positives: 'Mobile users who switch between networks and carrier NAT pools. Silent: it adds risk.'
  references: ['https://attack.mitre.org/techniques/T1078/']
