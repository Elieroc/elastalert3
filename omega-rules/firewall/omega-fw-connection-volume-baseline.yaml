name: omega-fw-connection-volume-baseline
type: baseline
index: logs-fortinet_fortigate.log-*,logs-panw.panos-*,logs-cisco_asa.log-*,logs-checkpoint.firewall-*,logs-sophos.xg-*,logs-juniper_srx.log-*,logs-pfsense.log-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1498, T1595, T1686]
filter:
- term: {event.category: network}
query_key: observer.name
bucket: {hours: 1}
history: {weeks: 4}
seasonality: hour_of_week
method: mad
threshold: 6
min_baseline_count: 20
realert: {hours: 2}
alert: [debug]
omega:
  tier: T2
  description: 'The number of connections a firewall logged in the last complete hour is far from what is normal for the same
    hour of the same weekday over the last 4 weeks (robust score above 6), up or down: a scan or flood, or an outage and a policy
    that blocks everything.'
  source: [firewall]
  false_positives: 'Campaigns, sales, migrations and holidays that move the weekly pattern. A quiet device has little history
    (min_baseline_count 20): tune bucket and threshold.'
  references: ['https://attack.mitre.org/techniques/T1498/', 'https://attack.mitre.org/techniques/T1595/']
