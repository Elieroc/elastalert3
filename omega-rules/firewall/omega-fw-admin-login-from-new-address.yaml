name: omega-fw-admin-login-from-new-address
type: new_term
index: logs-fortinet_fortigate.log-*,logs-panw.panos-*,logs-cisco_asa.log-*,logs-checkpoint.firewall-*,logs-sophos.xg-*,logs-juniper_srx.log-*,logs-pfsense.log-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1078, T1133]
risk_score: 20
risk_objects: {ip: source.ip, user: user.name}
filter:
- term: {event.category: authentication}
- term: {observer.type: firewall}
- term: {event.outcome: success}
- exists: {field: user.name}
fields:
- [user.name, source.ip]
terms_window_size: {days: 90}
use_keyword_postfix: false
realert: {minutes: 1}
alert: []
omega:
  tier: T1
  description: An administrator logs in to the firewall from an address it did not use in 90 days.
  source: [firewall]
  false_positives: 'Administrators who work from a new place or network. Silent: it adds risk.'
  references: ['https://attack.mitre.org/techniques/T1078/']
