name: omega-fw-vpn-login-from-new-country
type: new_term
index: logs-fortinet_fortigate.log-*,logs-panw.panos-*,logs-cisco_asa.log-*,logs-checkpoint.firewall-*,logs-sophos.xg-*,logs-juniper_srx.log-*,logs-pfsense.log-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1078, T1133]
risk_score: 15
risk_objects: {user: user.name, ip: source.ip}
filter:
- term: {event.category: authentication}
- term: {event.outcome: success}
- bool:
    should:
    - bool:
        should:
        - wildcard:
            event.dataset: {value: '*vpn*', case_insensitive: true}
        minimum_should_match: 1
    - bool:
        should:
        - wildcard:
            event.action: {value: '*vpn*', case_insensitive: true}
        minimum_should_match: 1
    minimum_should_match: 1
- exists: {field: user.name}
- exists: {field: source.geo.country_iso_code}
fields:
- [user.name, source.geo.country_iso_code]
terms_window_size: {days: 30}
use_keyword_postfix: false
realert: {minutes: 1}
alert: []
omega:
  tier: T1
  description: A VPN account logs in successfully from a country it has not used in 30 days.
  source: [vpn]
  false_positives: 'Travel, holidays and carrier egress points abroad. Needs GeoIP in the VPN logs. Silent: it adds risk.'
  references: ['https://attack.mitre.org/techniques/T1078/', 'https://attack.mitre.org/techniques/T1133/']
