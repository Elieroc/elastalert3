name: omega-fw-vpn-login-bruteforce
type: frequency
index: logs-fortinet_fortigate.log-*,logs-panw.panos-*,logs-cisco_asa.log-*,logs-checkpoint.firewall-*,logs-sophos.xg-*,logs-juniper_srx.log-*,logs-pfsense.log-*,filebeat-*
timestamp_field: '@timestamp'
priority: 3
mitre_attack: [T1110.001, T1110.004, T1133]
risk_score: 15
risk_objects: {ip: source.ip, user: user.name}
filter:
- term: {event.category: authentication}
- term: {event.outcome: failure}
- bool:
    should:
    - bool:
        should:
        - wildcard:
            event.dataset: {value: '*vpn*', case_insensitive: true}
        minimum_should_match: 1
    - bool:
        should:
        - wildcard:
            event.action: {value: '*vpn*', case_insensitive: true}
        minimum_should_match: 1
    minimum_should_match: 1
num_events: 8
timeframe: {minutes: 10}
query_key: source.ip
realert: {minutes: 30}
alert: []
omega:
  tier: T1
  description: One address fails 8 or more VPN logins within 10 minutes.
  source: [vpn]
  false_positives: 'A user who mistypes a password with a stored credential retrying (exclude the address). Silent: it adds risk,
    the correlation rule alerts when a guess works.'
  references: ['https://attack.mitre.org/techniques/T1110/001/', 'https://attack.mitre.org/techniques/T1133/']
